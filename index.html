<script>

const J=o=>JSON.parse(JSON.stringify(o));
const sg=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};

/* ========= MESIN SOAL ========= */
function Q(q,a,e,c,img){
  const ds=sh([...new Set(c)]).filter(x=>x&&x!==a).slice(0,3);
  return{q,a,e,o:sh([a,...ds]),img:img||'',bad:ds.length<3};
}
const qk=q=>q.q+'|'+q.a;
function genSet(b,s,l,n=20,pv=[]){
  const f=T[b].sub[s].g[l],seen=new Set,out=[];let t=0;
  while(out.length<n&&t<n*60){t++;const q=f(),k=qk(q);
    if(seen.has(k))continue; if(t<n*30&&pv.includes(k))continue;
    seen.add(k);q.b=b;q.s=s;q.l=l;out.push(q)}
  return out;
}
function genMix(b,n=20,pv=[]){
  const seen=new Set,out=[];let t=0;
  while(out.length<n&&t<n*60){t++;const s=ri(0,T[b].sub.length-1),l=0,q=T[b].sub[s].g[l](),k=qk(q);
    if(seen.has(k)||(t<n*30&&pv.includes(k)))continue;seen.add(k);q.b=b;q.s=s;q.l=l;out.push(q)}

const S7=[mkS('I','1','I','my','me'),mkS('You','2','You','your','you'),mkS('He','s','He','his','him'),mkS('She','s','She','her','her'),mkS('It','s','It','its','it'),mkS('We','p','We','our','us'),mkS('They','p','They','their','them')];
const PER=[...SN,...SX],ALL=[...PER,...S7],PP=PER.filter(x=>x.pr!=='It');

v('go','goes','went','going','to the market',1),v('eat','eats','ate','eating','fried rice',1),v('drink','drinks','drank','drinking','milk',1),v('write','writes','wrote','writing','a letter',1),v('read','reads','read','reading','a book',1),v('buy','buys','bought','buying','a pen',1),v('see','sees','saw','seeing','a movie',1),v('take','takes','took','taking','a bus',1),v('swim','swims','swam','swimming','in the pool',1),v('run','runs','ran','running','in the park',1),v('sing','sings','sang','singing','a song',1),v('make','makes','made','making','a cake',1)];

const bank=(arr,ex)=>()=>{const x=pick(arr);return Q(x[0],x[1],ex(x),x[2])};

/* ========= GAMBAR SVG (preposisi tempat) ========= */
function svgRel(r){
  const box=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${f||'#c9d6e2'}" stroke="#6b7f95" stroke-width="3"/>`;
  const ball=(x,y,rr=13)=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="#ff9f1c" stroke="#b36b00" stroke-width="3"/>`;
  let g='';
  if(r=='on')g=box(60,70,80,52)+ball(100,57);
  else if(r=='in')g=ball(100,92)+`<rect x="60" y="66" width="80" height="60" rx="8" fill="none" stroke="#6b7f95" stroke-width="3" stroke-dasharray="7 5"/>`;
  else if(r=='under')g=box(60,28,80,46)+ball(100,100);

  return `<svg viewBox="0 0 200 150" role="img" aria-label="Posisi bola terhadap kotak"><line x1="6" y1="128" x2="194" y2="128" stroke="#6b7f95" stroke-width="2"/>${g}</svg>`;
}


/* ========= GENERATOR SOAL ========= */
const SB=(n,m,f)=>({n,m,g:[f]});

/* ---- Lesson 1: Part of Speech ---- */
const PW={
 noun:['notebook','teacher','city','table','river','school','mother','garden','window','doctor','village','pencil','ocean','farmer','mountain','bread','market','bridge','bicycle','kitchen'],

function recordAns(q,ok){

    if(S.wr.length>80){S.wr.sort((x,y)=>y.t-x.t);S.wr=S.wr.slice(0,60)}}
}
function ans(i){
  if(P.ans[P.i]!=null)return;const q=P.qs[P.i],ok=q.o[i]===q.a;P.ans[P.i]=i;
  S.tot++;if(ok){S.ok++;S.xp+=10}recordAns(q,ok);touch();sv();render();
}

  const n=P.qs.length,ok=P.qs.filter((q,i)=>q.o[P.ans[i]]===q.a).length,sc=Math.round(ok/n*100),st=starsOf(sc);
  let bonus=20;if(sc===100){bonus+=50;S.perf=true}S.xp+=bonus;
  const bk=P.s<0?P.b+'_mix':`${P.b}_${P.s}_${P.l}`;
  const o=S.st[bk];if(!o||sc>o.b)S.st[bk]={b:sc,s:Math.max(st,o?o.s:0)};else if(st>o.s)o.s=st;
  S.pv[bk]=P.qs.map(qk);P.fin={ok,n,sc,st,bonus};S.ses=null;sv();V='res';render();scrollTo(0,0);if(sc>=70)confetti();

};

/* ========= ULANGAN MANDIRI ========= */
W.ulg=()=>`<h2>📝 Ulangan Mandiri</h2><div class="card"><b>Pilih bab</b><div class="chips" style="margin:8px 0">${T.map((c,b)=>`<span class="chip ${X.bs[b]?'on2':''}" role="button" tabindex="0" onclick="X.bs[${b}]=!X.bs[${b}];render()">${CI[b]} Lesson ${b+1}. ${esc(c.t)}</span>`).join('')}</div>
<b>Jumlah soal</b><div class="chips" style="margin:8px 0">${[10,20,25,40].map(n=>`<span class="chip ${X.n===n?'on2':''}" role="button" tabindex="0" onclick="X.n=${n};render()">${n}</span>`).join('')}</div>
<b>Waktu</b><div class="chips" style="margin:8px 0">${[0,15,30,45,60].map(n=>`<span class="chip ${X.tm===n?'on2':''}" role="button" tabindex="0" onclick="X.tm=${n};render()">${n?n+' menit':'Tanpa waktu'}</span>`).join('')}</div>
<button class="btn" onclick="xstart()">Mulai ulangan</button></div>
<h3>Ulangan terakhir</h3>${S.xh.length?`<div class="card tbl-w"><table class="tbl">${S.xh.slice(0,5).map(h=>`<tr><td>${new Date(h.t).toLocaleString('id-ID')}</td><td>${esc(h.m)}</td><td><b>${h.sc}</b></td></tr>`).join('')}</table></div>`:'<div class="card">Belum ada ulangan.</div>'}`;
function xstart(){
  const bs=X.bs.map((v,i)=>v?i:-1).filter(i=>i>=0),ls=[0];
  if(!bs.length||!ls.length){toast('Pilih minimal satu bab dan satu level');return}if(!confirmNew())return;
  const seen=new Set,qs=[];let t=0;while(qs.length<X.n&&t<X.n*60){t++;const b=pick(bs),s=ri(0,T[b].sub.length-1),l=pick(ls),q=T[b].sub[s].g[l](),k=qk(q);if(seen.has(k))continue;seen.add(k);q.b=b;q.s=s;q.l=l;qs.push(q)}
  P={mode:'ul',ul:true,qs,ans:qs.map(()=>null),i:0,tm:X.tm,left:X.tm*60,end:Date.now()+X.tm*60000,cfg:{bs,ls,n:X.n}};S.ses=null;sv();V='xplay';render();scrollTo(0,0);
}
function tick(){
  const left=Math.max(0,Math.round((P.end-Date.now())/1000)),e=$('#tm');
  if(e){e.textContent=`⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;e.classList.toggle('low',left<60)}
  if(left<=0){clearInterval(TMI);toast('Waktu habis!');finishUl(true)}
}
function xans(i){P.ans[P.i]=i;sv();render()}
function xgo(i){P.i=i;sv();render();scrollTo(0,0)}
W.xplay=()=>{
  const q=P.qs[P.i],a=P.ans[P.i],n=P.qs.length;
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">Ulangan mandiri</span>${P.tm?`<span class="timer" id="tm"></span>`:''}<span>Soal ${P.i+1}/${n}</span></div>
<div class="qn" style="margin:10px 0">${P.qs.map((_,i)=>`<button class="${P.ans[i]!=null?'a':''} ${i===P.i?'c':''}" onclick="xgo(${i})" aria-label="Soal ${i+1}">${i+1}</button>`).join('')}</div>
<div class="qt">${qh(q.q)}</div>${q.img?`<div class="qimg">${q.img}</div>`:''}
<div class="opts">${q.o.map((o,i)=>`<button class="opt ${a===i?'sel':''}" onclick="xans(${i})"><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('')}</div>
<div class="row" style="margin-top:14px"><button class="btn s" ${P.i===0?'disabled':''} onclick="xgo(${P.i-1})">‹ Sebelumnya</button><button class="btn s" ${P.i===n-1?'disabled':''} onclick="xgo(${P.i+1})">${a==null?'Lewati ›':'Berikutnya ›'}</button><button class="btn" onclick="finishUl(false)">Selesai</button></div></div><button class="btn s" onclick="go('home')">Simpan &amp; keluar</button>`;
};
function finishUl(auto){
  if(!P||P.fin)return;const un=P.ans.filter(x=>x==null).length;
  if(!auto&&un&&!confirm(`${un} soal belum dijawab. Selesaikan ulangan?`))return;
  clearInterval(TMI);const n=P.qs.length;let ok=0;
  P.qs.forEach((q,i)=>{const c=q.o[P.ans[i]]===q.a;S.tot++;if(c){ok++;S.ok++;S.xp+=10}recordAns(q,c)});
  const sc=Math.round(ok/n*100);let bonus=20;if(sc===100){bonus+=50;S.perf=true}S.xp+=bonus;touch();
  const m={};P.qs.forEach((q,i)=>{const k=q.b+'_'+q.s,r=m[k]||(m[k]={b:q.b,s:q.s,n:0,ok:0});r.n++;if(q.o[P.ans[i]]===q.a)r.ok++});
  P.fin={ok,n,sc,st:starsOf(sc),bonus,m:Object.values(m)};
  S.xh.unshift({t:Date.now(),m:[...new Set(P.qs.map(q=>'Lesson '+(q.b+1)))].join(', '),l:'1',sc});S.xh=S.xh.slice(0,12);
  S.ses=null;sv();V='xres';render();scrollTo(0,0);if(sc>=70)confetti();
}
W.xres=()=>{
  const f=P.fin;
  return `<div class="card" style="text-align:center"><h2>Hasil Ulangan</h2><div class="big">${f.sc}</div><div class="stars">${'★'.repeat(f.st)}${'☆'.repeat(3-f.st)}</div><p><span class="grn">${f.ok} benar</span> · <span class="red">${f.n-f.ok} salah</span> · +${f.ok*10+f.bonus} XP</p></div>
<div class="card"><h3>Penguasaan per materi</h3>${f.m.map(r=>{const p=Math.round(r.ok/r.n*100);return `<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(sbn(r.b,r.s))}</span><b class="${p<60?'red':'grn'}">${p}% (${r.ok}/${r.n})</b></div><div class="bar"><i style="width:${p}%;background:${p<60?'var(--bad)':'var(--ok)'}"></i></div></div>`}).join('')}</div>
<div class="card"><h3>Review soal</h3>${P.qs.map((q,i)=>{const a=P.ans[i],ok=q.o[a]===q.a;return `<div style="padding:10px 0;border-top:1px solid var(--line)"><b>${i+1}.</b> ${qh(q.q)}${q.img?`<div class="qimg">${q.img}</div>`:''}<div>Jawabanmu: <b class="${ok?'grn':'red'}">${a==null?'(kosong)':esc(q.o[a])}</b>${ok?'':` · Benar: <b class="grn">${esc(q.a)}</b>`}</div><small style="color:var(--mut)">${esc(q.e)}</small></div>`}).join('')}</div>
<div class="row"><button class="btn" onclick="go('ulg')">Ulangan baru</button><button class="btn s" onclick="go('home')">Beranda</button></div>`;
};

/* ========= PROGRESS ========= */
W.prog=()=>`<h2>📊 Progress</h2>${T.map((c,b)=>{let n=0,ok=0,tr=0;c.sub.forEach((_,s)=>[0].forEach(l=>{const a=S.ac[`${b}_${s}_${l}`];if(a){n+=a.n;ok+=a.ok}}));const tried=c.sub.filter((_,s)=>[0].some(l=>S.ac[`${b}_${s}_${l}`])).length;
  return `<div class="card"><h3>${CI[b]} Lesson ${b+1}. ${esc(c.t)}</h3><small>${tried}/${c.sub.length} sub-bab dicoba · akurasi ${n?Math.round(ok/n*100):0}%</small><div class="tbl-w"><table class="tbl"><tr><th>Sub-bab</th><th>Skor</th></tr>${c.sub.map((sb,s)=>`<tr><td>${esc(sb.n)}</td>${[0].map(l=>{const t=S.st[`${b}_${s}_${l}`];return `<td>${t?t.b+' '+'★'.repeat(t.s):'–'}</td>`}).join('')}</tr>`).join('')}</table></div></div>`}).join('')}
<div class="card"><h3>Riwayat ulangan mandiri</h3>${S.xh.length?`<div class="tbl-w"><table class="tbl"><tr><th>Waktu</th><th>Materi</th><th>Skor</th></tr>${S.xh.map(h=>`<tr><td>${new Date(h.t).toLocaleString('id-ID')}</td><td>${esc(h.m)}</td><td><b>${h.sc}</b></td></tr>`).join('')}</table></div>`:'Belum ada.'}</div>
<div class="card"><h3>Soal yang pernah salah</h3>${S.wr.length?[...S.wr].sort((a,b)=>b.c-a.c||b.t-a.t).slice(0,10).map(w=>`<div style="padding:8px 0;border-top:1px solid var(--line)">${qh(w.q)}${w.im?' 🖼️':''}<div>Benar: <b class="grn">${esc(w.a)}</b> · salah ${w.c}×</div><small style="color:var(--mut)">${esc(w.e)}</small></div>`).join(''):'Belum ada soal salah. 🎉'}</div>`;

/* ========= GURU ========= */
W.guru=()=>{
  if(!GA)return `<div class="card" style="max-width:420px;margin:auto"><h2>Dashboard Guru</h2><label for="ge">Email</label><input type="email" id="ge"><label for="gp">PIN</label><input type="password" id="gp" onkeydown="if(event.key==='Enter')gLogin()"><button class="btn" onclick="gLogin()">Masuk</button></div>`;
  const sks=[...new Set(GL.map(x=>x.s))],kls=[...new Set(GL.map(x=>x.k))];
  return `<h2>Dashboard Guru</h2><div class="card"><div class="row"><select id="fs" style="width:auto" onchange="GF.sk=this.value;gt()"><option value="">Semua sekolah</option>${sks.map(x=>`<option ${GF.sk===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="fk" style="width:auto" onchange="GF.kl=this.value;gt()"><option value="">Semua kelas</option>${kls.map(x=>`<option ${GF.kl===x?'selected':''}>${esc(x)}</option>`).join('')}</select><input type="text" placeholder="Cari nama" style="width:200px" value="${esc(GF.q)}" oninput="GF.q=this.value;gt()"><span id="gon" class="pill"></span><span class="sync">${DB?'Realtime':'Data perangkat ini (offline)'}</span></div><div class="tbl-w" id="gtb">${gtbl()}</div></div>`;
};
function gRows(){return GL.filter(x=>(!GF.sk||x.s===GF.sk)&&(!GF.kl||x.k===GF.kl)&&(!GF.q||x.n.toLowerCase().includes(GF.q.toLowerCase())))}
const isOn=p=>p&&p.on&&(Date.now()+OFS-p.t)<75000;
function gtbl(){const r=gRows();const on=r.filter(x=>isOn(x.p)).length;setTimeout(()=>{const e=$('#gon');if(e)e.textContent=`${on} online`},0);
  return `<table class="tbl"><tr><th>Status</th><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>XP</th><th>Soal</th><th>Akurasi</th><th>Terakhir aktif</th></tr>${r.map(x=>`<tr style="cursor:pointer" onclick="gopen('${esc(x.key)}')"><td>${isOn(x.p)?'<span class="on">● online</span>':'○'}</td><td>${esc(x.n)}</td><td>${esc(x.k)}</td><td>${esc(x.s)}</td><td>${x.xp}</td><td>${x.tot}</td><td>${x.tot?Math.round(x.ok/x.tot*100):0}%</td><td>${x.t?new Date(x.t).toLocaleString('id-ID'):'–'}</td></tr>`).join('')||'<tr><td colspan="8">Belum ada siswa.</td></tr>'}</table>`}
function gt(){const e=$('#gtb');if(e)e.innerHTML=gtbl()}
function gLogin(){const e=$('#ge').value.trim(),p=$('#gp').value;if(e.toLowerCase()===TEMAIL.toLowerCase()&&p===TPIN){GA=true;render()}else toast('Email atau PIN salah')}
async function guruLoad(){
  try{let m,pr={};if(DB){m=(await DB.ref(`${APP}/ringkas`).once('value')).val()||{};pr=(await DB.ref(`${APP}/presence`).once('value')).val()||{}}else m=sg(LSS,{});
    GL=Object.entries(m).map(([key,x])=>Object.assign({key},x,{p:pr[key]})).sort((a,b)=>b.xp-a.xp);if(V==='guru'){gt()}}catch(e){}
  if(V==='guru'&&!$('#gtb')&&GA)render();
}
async function gopen(key){
  let d=null;try{d=DB?(await DB.ref(`${APP}/detail/${key}`).once('value')).val():sg(LS+'_'+key,null)}catch(e){}
  if(!d){toast('Data tidak ditemukan');return}GD=norm(d);GD.key=key;GC=null;V='gdet';render();scrollTo(0,0);
}
W.gdet=()=>{
  const d=GD,rows=[];
  T.forEach((c,b)=>c.sub.forEach((sb,s)=>[0].forEach(l=>{const a=d.ac[`${b}_${s}_${l}`];if(a)rows.push({b,s,l,n:a.n,p:Math.round(a.ok/a.n*100)})})));
  const weak=rows.filter(r=>r.n>=5).sort((a,b)=>a.p-b.p).slice(0,5);
  return `<button class="btn s" onclick="go('guru')">‹ Daftar siswa</button><h2>${esc(d.n)} <small>(${esc(d.k)} · ${esc(d.s)})</small></h2>
<div class="stats"><div class="stat"><b>${d.xp}</b>XP</div><div class="stat"><b>${d.streak}</b>Streak</div><div class="stat"><b>${d.tot}</b>Soal</div><div class="stat"><b>${accOf(d)}%</b>Akurasi</div></div>
<div class="card"><h3>Akurasi per bab</h3>${T.map((c,b)=>{let n=0,o=0;c.sub.forEach((_,s)=>[0].forEach(l=>{const a=d.ac[`${b}_${s}_${l}`];if(a){n+=a.n;o+=a.ok}}));const p=n?Math.round(o/n*100):0;return `<div style="margin:6px 0">Lesson ${b+1}. ${esc(c.t)} — <b>${p}%</b> (${n} soal)<div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
<div class="card"><h3>⚠️ Perlu bimbingan</h3>${weak.length?weak.map(r=>`<div>${esc(sbn(r.b,r.s))} — <b class="red">${r.p}%</b> (${r.n} soal)</div>`).join(''):'Belum ada materi dengan ≥5 soal per level.'}</div>
<div class="card tbl-w"><h3>Akurasi per sub-bab</h3><table class="tbl"><tr><th>Sub-bab</th><th>Skor</th></tr>${T.flatMap((c,b)=>c.sub.map((sb,s)=>`<tr><td>${b+1}. ${esc(sb.n)}</td>${[0].map(l=>{const a=d.ac[`${b}_${s}_${l}`];if(!a)return '<td>–</td>';const p=Math.round(a.ok/a.n*100);return `<td class="${p<60?'red':'grn'}">${p}% <small>(${a.n})</small></td>`}).join('')}</tr>`)).join('')}</table></div>
<div class="card"><h3>Riwayat ulangan</h3>${d.xh.length?d.xh.map(h=>`<div>${new Date(h.t).toLocaleString('id-ID')} · ${esc(h.m)} · <b>${h.sc}</b></div>`).join(''):'Belum ada.'}</div>
<div class="card"><h3>Soal yang sering salah</h3>${d.wr.length?[...d.wr].sort((a,b)=>b.c-a.c).slice(0,10).map(w=>`<div style="padding:6px 0;border-top:1px solid var(--line)">${qh(w.q)}<br>Benar: <b>${esc(w.a)}</b> · ${w.c}×</div>`).join(''):'Tidak ada.'}</div>
<div class="card"><h3>Kelola data</h3>${DB?(AU&&AU.currentUser?`<button class="btn d" onclick="gdel('${esc(d.key)}')">${GC===d.key?'Yakin hapus? Klik lagi':'Hapus data siswa'}</button>`:`<label>Login admin</label><input type="email" id="ae" placeholder="Email admin"><input type="password" id="ap" placeholder="Password"><div class="row"><button class="btn" onclick="adminIn()">Masuk</button><button class="btn s" onclick="adminG()">Masuk dengan Google</button></div>`):`<button class="btn d" onclick="gdel('${esc(d.key)}')">${GC===d.key?'Yakin hapus? Klik lagi':'Hapus data lokal siswa'}</button>`}</div>`;
};
async function adminIn(){try{await AU.signInWithEmailAndPassword($('#ae').value,$('#ap').value);render()}catch(e){toast('Login admin gagal')}}
async function adminG(){try{await AU.signInWithPopup(new firebase.auth.GoogleAuthProvider());render()}catch(e){toast('Login Google gagal')}}
async function gdel(key){
  if(GC!==key){GC=key;render();return}
  try{if(DB){await Promise.all(['detail','ringkas','presence'].map(p=>DB.ref(`${APP}/${p}/${key}`).remove()))}
    try{localStorage.removeItem(LS+'_'+key)}catch(e){}const m=sg(LSS,{});delete m[key];ss(LSS,m);GC=null;toast('Data dihapus');GL=GL.filter(x=>x.key!==key);go('guru')}catch(e){toast('Gagal hapus (perlu admin)')}
}

/* ========= VALIDATOR ========= */
let VR=null;
W.val=()=>`<h2>🧪 Validator Soal</h2><div class="card"><p>Membuat seluruh soal (semua bab, sub-bab, level) lalu memeriksa: 20 soal unik per sub-bab, jawaban ada di opsi, opsi tidak ganda, minimal 4 opsi.</p><button class="btn" onclick="runVal()">Jalankan validator</button></div>${VR?`<div class="card"><h3>Total soal: ${VR.total} · Temuan: ${VR.issues.length}</h3>${VR.issues.length?VR.issues.slice(0,40).map(x=>`<div class="red">• ${esc(x)}</div>`).join(''):'<div class="grn">✓ Semua soal lolos pemeriksaan.</div>'}</div>`:''}`;
function runVal(){
  const issues=[];let total=0;
  T.forEach((c,b)=>c.sub.forEach((sb,s)=>[0].forEach(l=>{
    const qs=genSet(b,s,l,20),tag=`Lesson ${b+1}.${s+1}`;total+=qs.length;
    if(qs.length<20)issues.push(`${tag}: hanya ${qs.length} soal unik`);
    qs.forEach((q,i)=>{if(!q.o.includes(q.a))issues.push(`${tag} #${i+1}: jawaban tidak ada di opsi`);if(new Set(q.o).size!==q.o.length)issues.push(`${tag} #${i+1}: opsi ganda`);if(q.o.length<4||q.bad)issues.push(`${tag} #${i+1}: pengecoh kurang — ${q.q}`)});
  })));
  VR={total,issues};render();
}

/* ========= TEMA, PARTIKEL, CONFETTI ========= */
const TH=[['samudra','Samudra','🫧'],['synthwave','Synthwave','✦'],['sakura','Sakura','🌸'],['kode','Kode Hijau','is/are'],['light','Terang','☀️'],['dark','Gelap','🌙']];
function setTheme(t,save){document.documentElement.dataset.theme=t;if(save)try{localStorage.setItem(LST,t)}catch(e){}particles(t);
  $('#thp').innerHTML=TH.map(x=>`<button class="${x[0]===t?'on':''}" onclick="setTheme('${x[0]}',true)">${x[1]}</button>`).join('')}
function particles(t){const ch=(TH.find(x=>x[0]===t)||TH[0])[2],list=t=='kode'?['is','are','-s','-ed','-ing','a','an']:[ch];
  $('#bg').innerHTML=rm()?'':Array.from({length:14},(_,i)=>`<span style="left:${ri(0,96)}%;animation-duration:${ri(14,30)}s;animation-delay:-${ri(0,25)}s">${list[i%list.length]}</span>`).join('')}
$('#thb').onclick=()=>{const p=$('#thp');p.hidden=!p.hidden};
function confetti(){
  if(rm())return;const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:Math.random()*4-2,vy:Math.random()*3+3,c:`hsl(${ri(0,360)} 90% 60%)`,s:ri(5,10)}));let f=0;
  (function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
}

/* ========= MULAI ========= */
(async function init(){
  const th=tsg(LST),t=th&&TH.some(x=>x[0]===th)?th:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'samudra');
  setTheme(t,false);render();await fbInit();updSy();
})();
</script>
