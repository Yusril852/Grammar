const g16A=mixG(

 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`${s.t} ___ ${x.b} ${x.o}. (need sebagai main verb; tidak perlu)`,s.p=='s'?"doesn't need to":"don't need to",'Main verb need: do/does not + need to.',[s.p=='s'?"don't need to":"doesn't need to","needn't to","doesn't needs to",'not need to'])},

 ()=>{const s=pick(ALLH),x=pick(VB),d=cap(auxD(s));return Q(`___ ${s.t} need to ${x.b} ${x.o}?`,d,`Tanya main verb need: ${d} + subjek + need to.`,['Do','Does','Need','Is'])},
 ()=>{const x=pick(VB);return Q(`___ I ${x.b} ${x.o}? (need sebagai modal; perlukah saya)`,'Need','Tanya modal need: Need + subjek + verb dasar.',['Need','Needs','Do need','Is need'])},
 ()=>{const s=pick(ALLH),n=pick(NN16);return Q(`${s.t} ___ a new ${n}. (butuh)`,s.p=='s'?'needs':'need','Need + kata benda: need/needs.',[s.p=='s'?'need':'needs',"needn't",'need to','is need'])},
 ()=>{const s=pick(ALLH),x=pick(VB),p=ppOf(x);return Q(`${s.t} ___ ${x.o}. It was not necessary. (sudah dilakukan, ternyata tidak perlu; ${x.b})`,`needn't have ${p}`,`needn't have + V3 (${p}): sudah dilakukan padahal tidak perlu.`,[`needn't ${x.b}`,`needn't had ${p}`,`didn't need ${p}`,`needn't to have ${p}`])},

 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`${s.t} ___ ${x.b} ${x.o}. (tidak berani; main verb)`,s.p=='s'?"doesn't dare to":"don't dare to",'Main verb dare: do/does not + dare to.',[s.p=='s'?"don't dare to":"doesn't dare to","daren't to","doesn't dares to",'not dare to'])},
 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`Yesterday, ${s.t} ___ ${x.b} ${x.o}. (tidak berani; lampau)`,"didn't dare to",'Lampau: did not + dare to.',["didn't dared to","daren't to","don't dare to","didn't dares to"])},
 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`${s.t} ___ ${x.b} ${x.o} alone every day. (berani; main verb)`,s.p=='s'?'dares to':'dare to','Main verb dare (positif): dare/dares + to + verb dasar.',[s.p=='s'?'dare to':'dares to','dares','daring to','dared to'])},
 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`___ ${s.t} ${x.b} ${x.o}? (dare sebagai modal; berani)`,'Dare','Tanya modal dare: Dare + subjek + verb dasar.',['Dare','Dares','Do dare','Is dare'])},
 ()=>{const s=pick(ALLH),x=pick(VB);return Q(CC,`${s.t} daren't ${x.b} ${x.o}.`,`Pola: daren't + ${x.b}.`,[`${s.t} daren't to ${x.b} ${x.o}.`,`${s.t} dares not ${x.b} ${x.o}.`,`${s.t} daren't ${x.s} ${x.o}.`,`${s.t} daren't ${x.g} ${x.o}.`])},

 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`${s.t} ___ ${x.b} ${x.o} as a child. (negatif)`,"didn't use to","Negatif: didn't use to (use, bukan used).",["didn't used to","don't use to",'not used to',"wasn't used to"])},
 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`___ ${s.t} use to ${x.b} ${x.o} as a child?`,'Did','Tanya: Did + subjek + use to + verb dasar.',['Do','Does','Was','Used'])},
 ()=>{const s=pick(ALLH),x=pick(VB);return Q(`${s.t} ${beP(s.p)} used to ___ ${x.o}. (sudah terbiasa; be used to)`,x.g,'be used to + V-ing: sudah terbiasa.',[x.b,x.s,x.p,`to ${x.b}`])},

const TBL=(rows,head=['','Rumus','Contoh'])=>`<div class="tbl-w"><table class="tbl"><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
/* Materi Grammar 1 (lengkap) */
(()=>{
const IN={0:'<b>Part of speech</b> adalah delapan golongan kata dalam bahasa Inggris: noun, pronoun, verb, adjective, adverb, preposition, conjunction, dan interjection. Mengenali golongan kata membantu menyusun kalimat yang benar.',
1:'<b>Noun</b> (kata benda) memberi nama orang, hewan, benda, tempat, atau gagasan. Noun dibagi menjadi proper, common, material, collective, abstract, dan possessive noun.',
2:'<b>Pronoun</b> (kata ganti) menggantikan noun agar kalimat tidak berulang. Ada personal, possessive, demonstrative, relative, interrogative, indefinite, serta emphatic dan reflexive pronoun.',
3:'<b>Verb</b> (kata kerja) menyatakan tindakan atau keadaan dan menunjukkan waktu kejadian. Bentuknya berubah menurut subjek dan tense.',
4:'<b>Adjective</b> (kata sifat) menerangkan noun atau pronoun: sifat, jumlah, kepemilikan, penunjuk, dan perbandingan.',
5:'<b>Adverb</b> (kata keterangan) menerangkan verb, adjective, atau adverb lain: cara, waktu, tempat, frekuensi, dan tingkat.',
6:'<b>Preposition</b> (kata depan) menghubungkan noun atau pronoun dengan kata lain dan menunjukkan tempat, waktu, atau arah.',
7:'<b>Conjunction</b> (kata hubung) menyambung kata, frasa, atau kalimat. Lesson ini juga membahas noun yang dapat dihitung dan yang tidak dapat dihitung.',
8:'<b>Gender</b> menunjukkan jenis kelamin atau ketiadaannya: masculine, feminine, common, dan neuter. Gender menentukan pronoun yang dipakai.',
9:'<b>Number</b> menunjukkan jumlah noun: singular (tunggal) dan plural (jamak). Number memengaruhi bentuk noun dan verb.'};
const M={
'0_0':`<p><b>Noun</b> = kata benda: nama orang, hewan, benda, tempat, atau gagasan.</p><ul><li>Orang: teacher, Budi. Hewan: cat. Benda: book. Tempat: Jakarta. Gagasan: happiness.</li><li>Fungsi: subjek (<i>The teacher</i> is kind), objek (I like <i>bread</i>), atau setelah preposisi (in <i>Jakarta</i>).</li><li>Noun bisa tunggal atau jamak: book → books.</li></ul>`,
'0_1':`<p><b>Pronoun</b> = kata ganti: menggantikan noun agar tidak diulang.</p><ul><li>Budi is tall. <i>He</i> is a student. (He = Budi)</li><li>Jenis: personal (I, you, he), possessive (mine), demonstrative (this), relative (who), interrogative (what), indefinite (someone), reflexive (myself).</li><li>Pronoun menggantikan noun. Yang menerangkan noun adalah adjective.</li></ul>`,
'0_2':`<p><b>Verb</b> = kata kerja: tindakan atau keadaan.</p><ul><li>Tindakan: eat, write, run. Keadaan: be, seem, know.</li><li>Verb menunjukkan waktu (tense): she <i>walks</i>, she <i>walked</i>.</li><li>Helping verb: is, have, do, can, will.</li></ul>`,
'0_3':`<p><b>Adjective</b> = kata sifat: menerangkan noun atau pronoun.</p><ul><li>Letak: sebelum noun (a <i>big</i> house) atau setelah be (The house is <i>big</i>).</li><li>Menjawab: What kind? Which one? How many?</li><li>Adjective tidak berubah untuk jamak: a tall boy, two tall boys.</li></ul>`,
'0_4':`<p><b>Adverb</b> = menerangkan verb, adjective, atau adverb lain.</p><ul><li>Menerangkan verb: She runs <i>quickly</i>. Adjective: <i>very</i> big. Adverb: <i>quite</i> slowly.</li><li>Menjawab: How? When? Where? How often?</li><li>Banyak adverb = adjective + -ly (quick → quickly).</li></ul>`,
'0_5':`<p><b>Preposition</b> = kata depan: menunjukkan hubungan tempat, waktu, atau arah antara noun/pronoun dan kata lain.</p><ul><li>Tempat: in the room, on the table, under the bed, between A and B.</li><li>Waktu: at 7 o'clock, on Monday, in June.</li><li>Setelah preposisi dipakai bentuk objek: with <i>me</i>, to <i>him</i>.</li></ul>`,
'0_6':`<p><b>Conjunction</b> = kata hubung: menyambung kata, frasa, atau kalimat (and, but, or, because, although).</p><p><b>Interjection</b> = kata seru: menyatakan perasaan mendadak (Wow! Ouch! Hurray!).</p><ul><li>I like tea <i>and</i> coffee. She is tired <i>but</i> happy.</li><li>Interjection berdiri sendiri, biasanya diikuti tanda seru.</li></ul>`,
'1_0':`<p><b>Proper noun</b> = nama khusus; selalu diawali huruf kapital.</p><ul><li>Orang: Budi, Sari. Tempat: Jakarta, Indonesia. Waktu: Monday, August.</li><li>Biasanya tanpa a/an.</li><li>Salah: <s>I live in jakarta</s>. Benar: I live in <b>Jakarta</b>.</li></ul>`,
'1_1':`<p><b>Common noun</b> = nama umum orang, hewan, benda, atau tempat.</p><ul><li>boy, city, river, teacher, book.</li><li>Tidak diawali kapital kecuali di awal kalimat.</li><li>Bandingkan: city (umum) dan Semarang (khusus).</li></ul>`,
'1_2':`<p><b>Material noun</b> = nama bahan pembuat benda.</p><ul><li>gold, silver, wood, cotton, glass, plastic, paper.</li><li>Umumnya tidak dapat dihitung: <i>some wood</i>, bukan <s>a wood</s>.</li><li>A house made of wood. A gold ring.</li></ul>`,
'1_3':`<p><b>Collective noun</b> = nama kelompok orang, hewan, atau benda.</p>${TBL([['team','a team of players'],['flock','a flock of birds'],['herd','a herd of cows'],['class','a class of students'],['bunch','a bunch of flowers']],['Kata','Contoh'])}<ul><li>Dianggap satu kesatuan: <i>The team is</i> winning.</li></ul>`,
'1_4':`<p><b>Abstract noun</b> = nama sifat, perasaan, atau keadaan; tidak dapat disentuh.</p><ul><li>happiness, honesty, courage, freedom, love, beauty.</li><li>Banyak dibentuk dari adjective: happy → happiness, brave → bravery.</li></ul>`,
'1_5':`<p><b>Possessive noun</b> = noun yang menyatakan kepemilikan.</p>${TBL([['Tunggal',"+ 's","Budi's book"],['Jamak berakhiran -s',"+ '","the boys' toys"],['Jamak tak beraturan',"+ 's","the children's room"]],['Jenis','Aturan','Contoh'])}<ul><li>Untuk benda mati sering dipakai of: the leg <i>of</i> the table.</li></ul>`,
'2_0':`<p><b>Personal pronoun</b> = kata ganti orang.</p>${TBL([['Subjek','I, you, he, she, it, we, they'],['Objek','me, you, him, her, it, us, them']],['Fungsi','Bentuk'])}<ul><li>Subjek di depan verb: <i>She</i> likes him.</li><li>Objek setelah verb atau preposisi: She likes <i>him</i>. Give it to <i>me</i>.</li></ul>`,
'2_1':`<p><b>Possessive pronoun</b> berdiri sendiri, tanpa noun.</p>${TBL([['my','mine'],['your','yours'],['his','his'],['her','hers'],['our','ours'],['their','theirs']],['Possessive adjective (+ noun)','Possessive pronoun (sendiri)'])}<ul><li>This is my bag. = This bag is <i>mine</i>.</li><li>Tanpa apostrof: <s>her's</s> → hers.</li></ul>`,
'2_2':`<p><b>Demonstrative pronoun</b> = kata ganti penunjuk.</p>${TBL([['this','dekat','tunggal'],['these','dekat','jamak'],['that','jauh','tunggal'],['those','jauh','jamak']],['Kata','Jarak','Jumlah'])}<ul><li><i>This</i> is my pen. <i>Those</i> are his shoes.</li></ul>`,
'2_3':`<p><b>Relative pronoun</b> menghubungkan klausa dengan noun yang diterangkan.</p>${TBL([['who','orang (subjek)','The girl <b>who</b> sits there is my sister.'],['whom','orang (objek)','The man <b>whom</b> I met is a doctor.'],['whose','kepemilikan','The boy <b>whose</b> bag is red is Budi.'],['which','benda/hewan','The book <b>which</b> I read is good.'],['that','orang/benda','The pen <b>that</b> I lost was blue.']],['Kata','Untuk','Contoh'])}`,
'2_4':`<p><b>Interrogative pronoun</b> = kata ganti tanya.</p>${TBL([['Who','orang','Who is that?'],['Whom','orang (objek)','Whom did you meet?'],['Whose','milik siapa','Whose is this bag?'],['What','apa','What is this?'],['Which','pilihan terbatas','Which do you prefer, tea or coffee?']],['Kata','Untuk','Contoh'])}`,
'2_5':`<p><b>Indefinite pronoun</b> = tidak menunjuk orang atau benda tertentu.</p><ul><li>someone, anyone, nobody, everyone, something, everything, each, both, few, little, many, another.</li><li><i>some</i> untuk kalimat positif, <i>any</i> untuk negatif dan tanya: I have <i>something</i>. I don't have <i>anything</i>.</li><li>everyone, everything, nobody memakai verb tunggal: <i>Everyone is</i> here. <i>Both</i> memakai verb jamak.</li></ul>`,
'2_6':`<p><b>Reflexive pronoun</b>: pelaku sama dengan penderita. <b>Emphatic pronoun</b>: menekankan pelaku.</p>${TBL([['I','myself'],['you','yourself / yourselves'],['he / she / it','himself / herself / itself'],['we / they','ourselves / themselves']],['Subjek','Pronoun'])}<ul><li>Reflexive: She cut <i>herself</i>.</li><li>Emphatic: I <i>myself</i> did it.</li></ul>`,
'3_0':`<p><b>Verb</b> = kata kerja.</p>${TBL([['Simple present','he/she/it + s/es','She walks. He watches.'],['Simple past','-ed atau tak beraturan','She walked. He went.'],['Past participle','V3','has walked, has gone'],['Present participle','V-ing','is walking']],['Bentuk','Aturan','Contoh'])}<ul><li>Helping verb: is, am, are, was, were, do, does, did, have, has, had, can, will, must, should.</li><li>Verb tak beraturan: go → went → gone, eat → ate → eaten.</li></ul>`,
'4_0':`<p><b>Proper adjective</b> berasal dari nama khusus; selalu diawali huruf kapital.</p>${TBL([['Indonesia','Indonesian'],['Japan','Japanese'],['England','English'],['China','Chinese']],['Nama','Adjective'])}<ul><li>Indonesian food, Japanese car.</li></ul>`,
'4_1':`<p><b>Adjective of quality</b> = menerangkan sifat atau keadaan.</p><ul><li>big, clever, tired, sick, kind, beautiful.</li><li>Kebalikan (antonim): big ≠ small, clever ≠ stupid.</li><li>Letak: a <i>clever</i> girl atau The girl is <i>clever</i>.</li></ul>`,
'4_2':`<p><b>Adjective of number or quantity</b> = menerangkan jumlah.</p>${TBL([['many, few','countable','many books, a few friends'],['much, little','uncountable','much water, a little time'],['some','kalimat positif','some rice'],['any','negatif dan tanya','any questions?'],['angka','one, two / first, second','two cats, the second day']],['Kata','Dipakai untuk','Contoh'])}`,
'4_3':`<p><b>Distributive adjective</b> = menunjuk anggota kelompok satu per satu.</p><ul><li><b>each</b> (masing-masing), <b>every</b> (setiap), <b>either</b> (salah satu dari dua), <b>neither</b> (tidak satu pun dari dua).</li><li>Diikuti noun tunggal dan verb tunggal: <i>Each student</i> has a book.</li></ul>`,
'4_4':`<p><b>Demonstrative adjective</b> = penunjuk sebelum noun.</p><ul><li><b>this / that</b> + noun tunggal: this book, that house.</li><li><b>these / those</b> + noun jamak: these books, those shoes.</li><li>Berbeda dari demonstrative pronoun yang berdiri sendiri: <i>This</i> is good.</li></ul>`,
'4_5':`<p><b>Interrogative adjective</b> = kata tanya + noun.</p>${TBL([['What + noun','umum','What time is it?'],['Which + noun','pilihan terbatas','Which bag is yours?'],['Whose + noun','pemilik','Whose pen is this?']],['Bentuk','Untuk','Contoh'])}`,
'4_6':`<p><b>Possessive adjective</b> = kepemilikan sebelum noun.</p><ul><li>my, your, his, her, its, our, their + noun: Sari loves <i>her</i> mother.</li><li><i>its</i> (milik) berbeda dari <i>it's</i> (it is).</li></ul>`,
'4_7':`<p><b>Adjective in comparison</b>: positive → comparative → superlative.</p>${TBL([['Pendek','tall','taller','tallest'],['Berakhiran -y','happy','happier','happiest'],['Panjang','beautiful','more beautiful','most beautiful'],['Tak beraturan','good','better','best'],['Tak beraturan','bad','worse','worst']],['Jenis','Positive','Comparative','Superlative'])}<ul><li>Comparative memakai <i>than</i>: She is taller <i>than</i> me.</li><li>Superlative memakai <i>the</i>: the tallest.</li></ul>`,
'5_0':`<p><b>Adverb</b> menerangkan verb, adjective, atau adverb lain.</p>${TBL([['Manner (cara)','quickly, slowly','She runs quickly.'],['Time (waktu)','yesterday, now','I met him yesterday.'],['Place (tempat)','here, there','Come here.'],['Frequency (frekuensi)','always, never','He always eats.'],['Degree (tingkat)','very, quite','It is very hot.']],['Jenis','Contoh','Kalimat'])}<ul><li>Adjective + -ly: quick → quickly, happy → happily.</li><li>Khusus: good → <i>well</i>. Sama bentuk: fast, hard, late.</li><li>Adverb frekuensi sebelum verb utama dan setelah be: She <i>always</i> eats. She is <i>always</i> late.</li></ul>`,
'5_1':`<p><b>Adverb in comparison</b> = perbandingan pada adverb.</p>${TBL([['fast','faster','fastest'],['early','earlier','earliest'],['carefully','more carefully','most carefully'],['well','better','best'],['badly','worse','worst']],['Positive','Comparative','Superlative'])}<ul><li>Adverb pendek: -er/-est. Adverb panjang (-ly): more/most.</li></ul>`,
'6_0':`<p><b>Preposition</b> = kata depan.</p>${TBL([['Tempat','in (di dalam), on (di permukaan), at (titik), under, between, behind, in front of','in the room, on the table, at the door'],['Waktu','at (jam), on (hari/tanggal), in (bulan/tahun)','at 7 o\'clock, on Monday, in June'],['Arah','to, from, into','go to school, from Jakarta'],['Tetap','good at, afraid of, interested in','good at English']],['Jenis','Preposisi','Contoh'])}<ul><li>Setelah preposisi: noun, pronoun objek, atau V-ing: interested in <i>learning</i>.</li></ul>`,
'7_0':`<p><b>Conjunction</b> = kata hubung.</p>${TBL([['Coordinating','and (tambahan), but/yet (pertentangan), or (pilihan), so (akibat)','I like tea <b>and</b> coffee.'],['Subordinating','because (sebab), although, if, unless, when, while','She stayed home <b>because</b> she was sick.'],['Correlative','both...and, either...or, neither...nor','<b>Both</b> Budi <b>and</b> Sari came.']],['Jenis','Kata','Contoh'])}<ul><li>Di depan klausa kedua: tanda koma sebelum <i>but</i> dan <i>so</i> pada kalimat panjang.</li></ul>`,
'7_1':`<p><b>Countable noun</b> dapat dihitung; <b>uncountable noun</b> tidak dapat dihitung.</p>${TBL([['Countable','a book, two books','many, a few, a number of'],['Uncountable','water, rice, advice, information','much, a little, a piece of']],['Jenis','Contoh','Penjumlah'])}<ul><li>Uncountable tidak punya bentuk jamak: <s>advices</s>, <s>informations</s>.</li><li>Dihitung dengan satuan: a glass of water, a piece of advice, a kilo of rice.</li><li>some dan any dipakai untuk keduanya.</li></ul>`,
'8_0':`<p><b>Masculine</b> = laki-laki.</p><ul><li>boy, man, king, lion, father, uncle.</li><li>Pronoun: he, him, his.</li><li>Pasangan: king ↔ queen, uncle ↔ aunt, lion ↔ lioness.</li></ul>`,
'8_1':`<p><b>Feminine</b> = perempuan.</p><ul><li>girl, woman, queen, lioness, mother, aunt.</li><li>Pronoun: she, her, hers.</li><li>Akhiran -ess: actor → actress, host → hostess.</li></ul>`,
'8_2':`<p><b>Common gender</b> = bisa laki-laki atau perempuan.</p><ul><li>teacher, student, doctor, child, parent, friend.</li><li>Pronoun menyesuaikan orangnya (he atau she), atau they bila tidak diketahui.</li></ul>`,
'8_3':`<p><b>Neuter gender</b> = benda mati atau tidak bernyawa.</p><ul><li>table, book, pen, house.</li><li>Pronoun: <i>it</i>, <i>its</i>.</li><li>Hewan kecil atau bayi yang jenis kelaminnya tidak diketahui sering memakai it.</li></ul>`,
'9_0':`<p><b>Singular</b> = tunggal (satu).</p><ul><li>a book, one child, this pen.</li><li>Verb: is, was, has, dan verb + s/es (She <i>walks</i>).</li><li>Memakai a/an: a cat, an egg.</li></ul>`,
'9_1':`<p><b>Plural</b> = jamak (lebih dari satu).</p>${TBL([['umum','+ s','book → books'],['berakhiran s, x, z, ch, sh','+ es','box → boxes'],['konsonan + y','y → ies','city → cities'],['f / fe','→ ves','knife → knives'],['tak beraturan','berubah bentuk','man → men, child → children, foot → feet'],['sama','tidak berubah','sheep, fish']],['Aturan','Pembentukan','Contoh'])}<ul><li>Verb jamak: are, were, have, dan verb tanpa s: They <i>walk</i>.</li></ul>`};
T1.forEach((c,b)=>{if(IN[b])c.intro=IN[b];c.sub.forEach((sb,i)=>{const k=b+'_'+i;if(M[k])sb.m=M[k]})});
})();
const ML1=true;
const T2=[
{t:'The Simple Present Tense',i:'⏰',les:true,bk:2,intro:'<b>Simple Present</b> menyatakan kebiasaan, fakta umum, dan jadwal tetap.',sub:[
SB('Form',`<p>Bentuk dasar simple present (V1):</p>${TBL([['Positif','S + V1 (+s/es untuk he/she/it)','She <b>plays</b> football. They <b>play</b> football.'],['Negatif','S + do not / does not + V1',"She <b>doesn't play</b> football. They <b>don't play</b>."],['Tanya','Do / Does + S + V1 ?','<b>Does</b> she <b>play</b> football?'],['To be','I <b>am</b>, he/she/it <b>is</b>, you/we/they <b>are</b>','She <b>is</b> a teacher. They <b>are</b> students.']])}<ul><li>Akhiran <b>-s/-es</b> hanya untuk he, she, it, atau subjek tunggal.</li><li>Verb berakhiran s, sh, ch, x, o → <b>-es</b> (watch→watches, go→goes).</li><li>Konsonan + y → <b>-ies</b> (study→studies). Vokal + y → hanya -s (play→plays).</li><li>Setelah does/doesn't, verb kembali ke bentuk dasar: She doesn't <b>play</b> (bukan plays).</li></ul>`,g1A),
SB('Usage',`<p>Simple present dipakai untuk:</p><ol><li><b>Kebiasaan atau rutinitas</b>: Budi <i>plays</i> football every Sunday.</li><li><b>Fakta umum</b>: The sun <i>rises</i> in the east.</li><li><b>Jadwal tetap</b>: The train <i>leaves</i> at 7 a.m.</li><li><b>Keadaan atau perasaan</b>: I <i>like</i> tea. She <i>knows</i> the answer.</li></ol><p><b>Penanda waktu:</b> every day, always, usually, often, sometimes, never, on Sundays, every week.</p><p><b>Posisi adverb frekuensi:</b> sebelum verb utama (She <u>always</u> goes), setelah to be (She is <u>always</u> late).</p>`,g1B),
SB('Simple Present Tense: Short Answers to Questions',`<p>Jawaban singkat memakai kata bantu yang sama dengan pertanyaan. <b>Verb utama tidak diulang.</b></p>${TBL([['Do you play football?','Yes, I <b>do</b>.',"No, I <b>don't</b>."],['Does she play football?','Yes, she <b>does</b>.',"No, she <b>doesn't</b>."],['Do they play football?','Yes, they <b>do</b>.',"No, they <b>don't</b>."],['Is he a teacher?','Yes, he <b>is</b>.',"No, he <b>isn't</b>."],['Are they students?','Yes, they <b>are</b>.',"No, they <b>aren't</b>."]],['Pertanyaan','Positif','Negatif'])}`,g1C)]},
{t:'The Present Continuous Tense',i:'🏃',les:true,bk:2,intro:'<b>Present Continuous</b> menyatakan kegiatan yang sedang berlangsung sekarang atau sementara.',sub:[
SB('Form',`${TBL([['Positif','S + am/is/are + V-ing','She <b>is cooking</b>. They <b>are playing</b>. I <b>am studying</b>.'],['Negatif','S + am/is/are + not + V-ing',"She <b>isn't cooking</b>. I <b>am not studying</b>."],['Tanya','Am/Is/Are + S + V-ing ?','<b>Is</b> she <b>cooking</b>?']])}<p><b>Aturan penulisan -ing:</b></p><ul><li>Akhiran -e dihapus: make → <b>making</b>, write → <b>writing</b>.</li><li>Satu suku kata berpola konsonan-vokal-konsonan: huruf akhir digandakan: run → <b>running</b>, swim → <b>swimming</b>, sit → <b>sitting</b>.</li><li>-ie → -ying: lie → <b>lying</b>.</li><li>Lainnya cukup ditambah -ing: play → <b>playing</b>, study → <b>studying</b>.</li></ul>`,g2A),
SB('Usage',`<ol><li><b>Kegiatan yang sedang berlangsung</b>: Look! The baby <i>is sleeping</i>.</li><li><b>Situasi sementara</b>: He <i>is working</i> in Surabaya this month.</li><li><b>Rencana masa depan yang sudah diatur</b>: We <i>are visiting</i> my grandmother tomorrow.</li></ol><p><b>Penanda waktu:</b> now, right now, at the moment, today, these days, this week, Look!, Listen!</p>`,g2B),
SB('Present Continuous and Present Simple',`${TBL([['Kebiasaan, fakta, jadwal','Kegiatan sedang berlangsung, sementara'],['She <b>plays</b> football every Sunday.','She <b>is playing</b> football now.'],['every day, always, usually, often','now, at the moment, Look!, Listen!']],['Simple Present','Present Continuous'])}<p><b>Stative verbs</b> (like, love, want, need, know, understand, hate, prefer, believe, own) <b>tidak</b> dipakai dalam continuous, walau ada kata <i>now</i>:</p><p>✅ I <b>know</b> the answer now. ❌ I am knowing the answer.</p>`,g2C),
SB('Present Continuous Tense: Short Answers to Questions',`${TBL([['Is she cooking?','Yes, she <b>is</b>.',"No, she <b>isn't</b>."],['Are they playing?','Yes, they <b>are</b>.',"No, they <b>aren't</b>."],['Are you studying?','Yes, I <b>am</b>.','No, I <b>am not</b>.'],['Am I speaking too fast?','Yes, you <b>are</b>.',"No, you <b>aren't</b>."]],['Pertanyaan','Positif','Negatif'])}<p>Verb -ing tidak diulang dalam jawaban singkat. Bentuk <i>am not</i> tidak boleh disingkat.</p>`,g2D)]},
{t:'The Simple Past Tense',i:'⏪',les:true,bk:2,intro:'<b>Simple Past</b> menyatakan kejadian yang sudah selesai di masa lampau.',sub:[
SB('Form',`${TBL([['Positif','S + V2','She <b>played</b> football. He <b>went</b> home.'],['Negatif','S + did not + V1',"She <b>didn't play</b> football."],['Tanya','Did + S + V1 ?','<b>Did</b> she <b>play</b> football?'],['To be','I/he/she/it <b>was</b>; you/we/they <b>were</b>','I <b>was</b> at home. They <b>were</b> late.']])}<p><b>Regular verbs</b> + -ed: play → played, like → <b>liked</b>, stop → <b>stopped</b>, study → <b>studied</b>.</p><p><b>Irregular verbs</b> (hafalkan): go → <b>went</b>, eat → <b>ate</b>, drink → <b>drank</b>, write → <b>wrote</b>, read → <b>read</b>, buy → <b>bought</b>, see → <b>saw</b>, take → <b>took</b>, swim → <b>swam</b>, run → <b>ran</b>, sing → <b>sang</b>, make → <b>made</b>.</p><p>Setelah did/didn't, verb kembali ke V1: She didn't <b>go</b> (bukan went).</p>`,g3A),
SB('Usage',`<ol><li><b>Kejadian selesai pada waktu tertentu</b>: I <i>visited</i> my grandmother last Sunday.</li><li><b>Kebiasaan di masa lampau</b>: When I was a child, I <i>played</i> in the river every afternoon.</li><li><b>Rangkaian kejadian</b>: He <i>woke up</i>, <i>took</i> a shower, and <i>went</i> to school.</li></ol><p><b>Penanda waktu:</b> yesterday, last night, last week, two days ago, in 2020, when I was a child.</p>`,g3B),
SB('Simple Past Tense: Short Answers to Questions',`${TBL([['Did you go to school?','Yes, I <b>did</b>.',"No, I <b>didn't</b>."],['Did she cook rice?','Yes, she <b>did</b>.',"No, she <b>didn't</b>."],['Was he at home?','Yes, he <b>was</b>.',"No, he <b>wasn't</b>."],['Were they late?','Yes, they <b>were</b>.',"No, they <b>weren't</b>."]],['Pertanyaan','Positif','Negatif'])}<p>Pertanyaan dengan <i>did</i> dijawab dengan did/didn't. Pertanyaan dengan <i>was/were</i> dijawab dengan was/were.</p>`,g3C)]},
{t:'The Past Continuous Tense',i:'🎞️',les:true,bk:2,intro:'<b>Past Continuous</b> menyatakan kegiatan yang sedang berlangsung pada waktu tertentu di masa lampau.',sub:[
SB('Form',`${TBL([['Positif','S + was/were + V-ing','She <b>was cooking</b>. They <b>were playing</b>.'],['Negatif','S + was/were + not + V-ing',"She <b>wasn't cooking</b>. They <b>weren't playing</b>."],['Tanya','Was/Were + S + V-ing ?','<b>Was</b> she <b>cooking</b>?']])}<p><b>was</b> untuk I, he, she, it. <b>were</b> untuk you, we, they, dan subjek jamak.</p>`,g4A),
SB('Usage',`<ol><li><b>Kegiatan berlangsung pada waktu tertentu di masa lampau</b>: At 8 o'clock last night, I <i>was studying</i>.</li><li><b>Dua kegiatan berlangsung bersamaan</b>: While Budi <i>was reading</i>, his sister <i>was watching</i> TV.</li><li><b>Kegiatan panjang terpotong kejadian singkat</b>: I <i>was walking</i> home when it <i>started</i> to rain.</li></ol><p><b>Penanda:</b> at 8 o'clock yesterday, this time yesterday, while, when.</p>`,g4B),
SB('Simple Past Continuous Tense: Short Answers to Questions',`${TBL([['Was she sleeping?','Yes, she <b>was</b>.',"No, she <b>wasn't</b>."],['Were they playing?','Yes, they <b>were</b>.',"No, they <b>weren't</b>."],['Were you studying?','Yes, I <b>was</b>.',"No, I <b>wasn't</b>."],['Was I talking too loudly?','Yes, you <b>were</b>.',"No, you <b>weren't</b>."]],['Pertanyaan','Positif','Negatif'])}`,g4C),
SB('Using the Past Continuous and Simple Past',`<p>Kegiatan <b>panjang</b> (past continuous) dipotong kejadian <b>singkat</b> (simple past):</p><ul><li>I <b>was watching</b> TV when the phone <b>rang</b>.</li><li>While we <b>were having</b> dinner, someone <b>knocked</b> on the door.</li></ul>${TBL([['when + simple past (kejadian singkat)','She was sleeping <b>when</b> the phone <b>rang</b>.'],['while + past continuous (kegiatan panjang)','<b>While</b> she <b>was sleeping</b>, the phone rang.']],['Pola','Contoh'])}<p>Jangan tukar: kejadian singkat tidak memakai continuous (❌ the phone was ringing → hanya jika deringnya berlangsung lama).</p>`,g4D)]},
{t:'The Present Perfect Tense',i:'✅',les:true,bk:2,intro:'<b>Present Perfect</b> menghubungkan masa lampau dengan sekarang: pengalaman, hasil sekarang, atau kegiatan yang berlanjut.',sub:[
SB('Form',`${TBL([['Positif','S + have/has + V3','She <b>has eaten</b>. They <b>have finished</b>.'],['Negatif','S + have/has + not + V3',"She <b>hasn't eaten</b>. They <b>haven't finished</b>."],['Tanya','Have/Has + S + V3 ?','<b>Has</b> she <b>eaten</b>?']])}<p><b>has</b> untuk he, she, it, subjek tunggal. <b>have</b> untuk I, you, we, they, subjek jamak.</p><p><b>V3 (past participle):</b> regular = V2 (played, visited). Irregular perlu dihafal:</p>${TBL([['go','went','<b>gone</b>'],['eat','ate','<b>eaten</b>'],['drink','drank','<b>drunk</b>'],['write','wrote','<b>written</b>'],['see','saw','<b>seen</b>'],['take','took','<b>taken</b>'],['swim','swam','<b>swum</b>'],['sing','sang','<b>sung</b>'],['buy','bought','<b>bought</b>'],['make','made','<b>made</b>']],['V1','V2','V3'])}`,g5A),
SB('Usage',`<ol><li><b>Pengalaman</b> (waktu tidak disebut): I <i>have visited</i> Bali twice. <i>Have</i> you <i>ever</i> ridden a horse?</li><li><b>Kejadian baru saja dengan hasil sekarang</b>: I <i>have just finished</i> my homework. The bus <i>has already left</i>.</li><li><b>Kegiatan yang mulai di masa lampau dan berlanjut</b>: I <i>have lived</i> here <b>for</b> five years. They <i>have studied</i> English <b>since</b> 2020.</li></ol><p><b>Penanda:</b> just, already, yet, ever, never, so far, recently, for (lama waktu), since (titik waktu).</p>`,g5B),
SB('The Present Perfect Tense: Short Answers to Questions',`${TBL([['Have you eaten?','Yes, I <b>have</b>.',"No, I <b>haven't</b>."],['Has she finished?','Yes, she <b>has</b>.',"No, she <b>hasn't</b>."],['Have they arrived?','Yes, they <b>have</b>.',"No, they <b>haven't</b>."]],['Pertanyaan','Positif','Negatif'])}<p>Verb V3 tidak diulang dalam jawaban singkat.</p>`,g5C),
SB('Using the Simple Past and the Present Perfect',`${TBL([['Waktu lampau jelas (yesterday, last week, in 2019, two days ago)','Waktu tidak disebut, atau berhubungan dengan sekarang (already, just, ever, never, so far)'],['I <b>visited</b> Bali <b>in 2019</b>.','I <b>have visited</b> Bali <b>twice</b>.'],['She <b>lost</b> her key <b>yesterday</b>.','She <b>has lost</b> her key. (sekarang belum ketemu)']],['Simple Past','Present Perfect'])}<p><b>Aturan praktis:</b> jika ada keterangan waktu lampau yang jelas, pakai <b>simple past</b>. Jangan pakai present perfect bersama yesterday, last week, in 2019, ago.</p>`,g5D)]},
{t:'The Present Perfect Continuous Tense',i:'⏳',les:true,bk:2,intro:'<b>Present Perfect Continuous</b> menyatakan kegiatan yang dimulai di masa lalu dan masih berlangsung, atau baru saja berhenti dengan hasil yang terlihat.',sub:[
SB('Form',`${TBL([['Positif','S + have/has + been + V-ing','I <b>have been studying</b>. She <b>has been studying</b>.'],['Negatif','S + have/has + not + been + V-ing',"They <b>haven't been studying</b>. He <b>hasn't been studying</b>."],['Tanya','Have/Has + S + been + V-ing ?','<b>Has</b> she <b>been studying</b>?']])}<ul><li><b>has</b> untuk he, she, it, dan subjek tunggal. <b>have</b> untuk I, you, we, they, dan subjek jamak.</li><li>Kontraksi: I've been, she's been, haven't, hasn't.</li><li>Penulisan -ing sama dengan present continuous (make → making, run → running).</li></ul>`,g6A),
SB('Usage',`<ol><li><b>Kegiatan mulai di masa lalu dan masih berlangsung</b>: I <i>have been waiting</i> for two hours.</li><li><b>Kegiatan baru saja berhenti, hasilnya terlihat</b>: Her eyes are red. She <i>has been crying</i>.</li><li><b>Kegiatan berulang sampai sekarang</b>: I <i>have been reading</i> a lot of novels lately.</li></ol><p><b>Penanda waktu:</b> for, since, all day, lately, recently, How long...?</p><p><b>for</b> + lamanya (for two hours). <b>since</b> + titik awal (since morning, since 2020).</p>`,g6B),
SB('Present Perfect Continuous Tense: Short Answers to Questions',`<p>Jawaban singkat memakai have/has saja. <b>Been dan V-ing tidak diulang.</b></p>${TBL([['Have you been waiting?','Yes, I <b>have</b>.',"No, I <b>haven't</b>."],['Has she been studying?','Yes, she <b>has</b>.',"No, she <b>hasn't</b>."],['Have they been working?','Yes, they <b>have</b>.',"No, they <b>haven't</b>."]],['Pertanyaan','Positif','Negatif'])}`,g6C),
SB('Using the Present Perfect Continuous and the Present Perfect',`${TBL([['Present Perfect Continuous','Fokus pada kegiatan dan lamanya','She <b>has been cooking</b> for two hours.'],['Present Perfect','Fokus pada hasil, jumlah, atau selesai','She <b>has cooked</b> three dishes.']],['Bentuk','Fokus','Contoh'])}<ul><li><b>How long</b> → present perfect continuous.</li><li><b>How many / How much</b> → present perfect.</li><li><b>Stative verb</b> (know, like, love, want, need, understand, believe) tidak dipakai continuous: I <b>have known</b> her since 2015 (bukan have been knowing).</li></ul>`,g6D)]},
{t:'The Past Perfect Tense',i:'⌛',les:true,bk:2,intro:'<b>Past Perfect</b> menyatakan kegiatan yang sudah selesai sebelum kegiatan atau waktu lampau lainnya.',sub:[
SB('Form',`${TBL([['Positif','S + had + V3','She <b>had finished</b> her homework.'],['Negatif','S + had not (hadn'+"'"+'t) + V3',"They <b>hadn't finished</b> the work."],['Tanya','Had + S + V3 ?','<b>Had</b> he <b>finished</b> the report?']])}<ul><li><b>had</b> dipakai untuk semua subjek.</li><li>Kontraksi: I'd, she'd, hadn't.</li><li>V3 beraturan: -ed. V3 tak beraturan: lihat Lesson 12.</li></ul>`,g7A),
SB('Usage',`<ol><li><b>Selesai sebelum kegiatan lampau lain</b>: When I arrived, the film <i>had started</i>.</li><li><b>Selesai sebelum waktu tertentu di masa lalu</b>: They <i>had finished</i> by 5 o'clock.</li><li><b>Alasan atau latar suatu kejadian</b>: We could not enter because the shop <i>had closed</i>.</li></ol><p><b>Penanda:</b> before, by the time, already, after, until then, by + waktu.</p><p>Kegiatan yang lebih dulu → <b>past perfect</b>. Kegiatan yang kemudian → <b>simple past</b>.</p>`,g7B),
SB('Using the Past Perfect and the Present Perfect',`${TBL([['Past Perfect','had + V3','Terjadi sebelum waktu lampau: By 2019, they <b>had lived</b> there for ten years.'],['Present Perfect','have/has + V3','Terkait sekarang: They <b>have lived</b> here for ten years.']],['Bentuk','Rumus','Pemakaian'])}<ul><li>Ada titik waktu lampau (when I arrived, by the time) → <b>had</b>.</li><li>Terkait sekarang (now, already, so far) → <b>have/has</b>.</li></ul>`,g7C),
SB('Past Perfect Tense: Short Answers to Questions',`<p>Jawaban singkat memakai <b>had</b>. Verb utama tidak diulang.</p>${TBL([['Had you finished?','Yes, I <b>had</b>.',"No, I <b>hadn't</b>."],['Had she finished?','Yes, she <b>had</b>.',"No, she <b>hadn't</b>."],['Had they finished?','Yes, they <b>had</b>.',"No, they <b>hadn't</b>."]],['Pertanyaan','Positif','Negatif'])}`,g7D)]},
{t:'The Past Perfect Continuous Tense',i:'🕰️',les:true,bk:2,intro:'<b>Past Perfect Continuous</b> menyatakan kegiatan yang sudah berlangsung selama beberapa waktu sampai suatu saat di masa lalu.',sub:[
SB('Form',`${TBL([['Positif','S + had + been + V-ing','She <b>had been studying</b> for two hours.'],['Negatif','S + had not (hadn'+"'"+'t) + been + V-ing',"They <b>hadn't been working</b>."],['Tanya','Had + S + been + V-ing ?','<b>Had</b> he <b>been waiting</b>?']])}<ul><li><b>had</b> dipakai untuk semua subjek.</li><li>Kontraksi: I'd been, she'd been, hadn't been.</li><li>Penulisan -ing sama dengan present continuous.</li></ul>`,g8A),
SB('Usage',`<ol><li><b>Kegiatan berlangsung sampai suatu saat di masa lalu</b>: I <i>had been waiting</i> for two hours when the bus came.</li><li><b>Kegiatan baru berhenti, hasilnya terlihat saat itu</b>: Her eyes were red. She <i>had been crying</i>.</li><li><b>Alasan suatu keadaan di masa lalu</b>: She was tired because she <i>had been working</i> all day.</li></ol><p><b>Penanda:</b> for, since, all day, how long, when + kejadian lampau, before.</p><p><b>Stative verb</b> (know, like, want) tidak dipakai continuous: gunakan past perfect (had known).</p>`,g8B),
SB('The Past Perfect Continuous is the past of the Present Perfect Continuous',`${TBL([['Present Perfect Continuous','have/has + been + V-ing','She <b>has been waiting</b> for an hour. (sampai sekarang)'],['Past Perfect Continuous','had + been + V-ing','She <b>had been waiting</b> for an hour when he came. (sampai waktu lampau)']],['Bentuk','Rumus','Contoh'])}<p>Ubah <b>have/has</b> menjadi <b>had</b>. Sisanya tetap: been + V-ing.</p>`,g8C)]},
{t:'The Future Tense',i:'🚀',les:true,bk:2,intro:'<b>Future Tense</b> menyatakan kegiatan yang akan terjadi, dengan <b>will</b> atau <b>be going to</b>.',sub:[
SB('Form',`${TBL([['Positif (will)','S + will + V1','She <b>will visit</b> Bali.'],['Negatif (will)','S + will not (won'+"'"+'t) + V1',"They <b>won't come</b> tomorrow."],['Tanya (will)','Will + S + V1 ?','<b>Will</b> he <b>help</b> us?'],['Be going to','S + am/is/are + going to + V1','I <b>am going to</b> study tonight. She <b>is going to</b> cook.']])}<ul><li><b>will</b> sama untuk semua subjek. Verb setelah will selalu bentuk dasar.</li><li>Kontraksi: I'll, she'll, won't.</li><li>Be going to: am untuk I, is untuk he/she/it, are untuk you/we/they.</li></ul>`,g9A),
SB('Usage',`<p><b>Will</b> untuk:</p><ol><li>Keputusan spontan: The phone is ringing. I <i>will answer</i> it.</li><li>Janji atau tawaran: I <i>will help</i> you.</li><li>Prediksi berdasarkan pendapat: I think it <i>will be</i> sunny.</li></ol><p><b>Be going to</b> untuk rencana atau prediksi berdasarkan bukti: Look at those clouds. It <i>is going to rain</i>.</p><p><b>Penanda waktu:</b> tomorrow, tonight, soon, next week, next year, in two days.</p>`,g9B),
SB('Future Tense: Short Answers to Questions',`<p>Jawaban singkat memakai kata bantu yang sama. <b>Verb utama tidak diulang.</b></p>${TBL([['Will you come?','Yes, I <b>will</b>.',"No, I <b>won't</b>."],['Will she help?','Yes, she <b>will</b>.',"No, she <b>won't</b>."],['Is he going to study?','Yes, he <b>is</b>.',"No, he <b>isn't</b>."],['Are you going to leave?','Yes, I <b>am</b>.',"No, I <b>'m not</b>."]],['Pertanyaan','Positif','Negatif'])}`,g9C),
SB('Be Going to and Will',`${TBL([['Be going to','Rencana yang sudah dibuat; bukti saat ini','We <b>are going to</b> visit Bali (tiket sudah dibeli). Look! It <b>is going to</b> rain.'],['Will','Keputusan spontan; janji; tawaran; pendapat','I <b>will</b> answer it. I think it <b>will</b> rain tomorrow.']],['Bentuk','Dipakai untuk','Contoh'])}<ul><li>Sudah direncanakan atau ada bukti → <b>be going to</b>.</li><li>Baru diputuskan, berjanji, menawarkan, atau berpendapat → <b>will</b>.</li></ul>`,g9D)]},
{t:'The Future Continuous Tense',i:'🔭',les:true,bk:2,intro:'<b>Future Continuous</b> menyatakan kegiatan yang sedang berlangsung pada waktu tertentu di masa depan.',sub:[
SB('Form',`${TBL([['Positif','S + will + be + V-ing','I <b>will be studying</b> at 8 p.m.'],['Negatif','S + will not (won'+"'"+'t) + be + V-ing',"They <b>won't be working</b> tomorrow."],['Tanya','Will + S + be + V-ing ?','<b>Will</b> she <b>be sleeping</b>?']])}<ul><li><b>will</b> sama untuk semua subjek.</li><li>Setelah <b>be</b>, verb memakai V-ing.</li><li>Kontraksi: I'll be, she'll be, won't be.</li></ul>`,g10A),
SB('Usage',`<ol><li><b>Kegiatan sedang berlangsung pada waktu tertentu di masa depan</b>: At 8 p.m. tonight, I <i>will be studying</i>.</li><li><b>Kegiatan berlangsung ketika kejadian lain terjadi</b>: When you arrive, I <i>will be cooking</i> dinner.</li><li><b>Pertanyaan sopan tentang rencana</b>: <i>Will</i> you <i>be using</i> the car this evening?</li></ol><p><b>Penanda waktu:</b> at 8 p.m. tonight, this time tomorrow, this time next week, at noon tomorrow, when you arrive.</p><p><b>Stative verb</b> (know, like, want) tidak dipakai continuous: gunakan will + V1.</p>`,g10B)]},
{t:'The Future Perfect Tense',i:'🏁',les:true,bk:2,intro:'<b>Future Perfect</b> menyatakan kegiatan yang sudah selesai sebelum waktu atau kejadian tertentu di masa depan.',sub:[
SB('Form',`${TBL([['Positif','S + will + have + V3','I <b>will have finished</b> my homework.'],['Negatif','S + will not (won'+"'"+'t) + have + V3',"They <b>won't have finished</b> the work."],['Tanya','Will + S + have + V3 ?','<b>Will</b> she <b>have left</b>?']])}<ul><li><b>will have</b> sama untuk semua subjek.</li><li>Setelah <b>have</b>, verb memakai V3 (past participle).</li><li>Kontraksi: I'll have, she'll have, won't have.</li></ul>`,g11A),
SB('Usage',`<ol><li><b>Selesai sebelum waktu tertentu di masa depan</b>: By 5 p.m., I <i>will have finished</i> my homework.</li><li><b>Selesai sebelum kejadian lain di masa depan</b>: By the time you arrive, she <i>will have left</i>.</li><li><b>Lama kegiatan yang tercapai pada waktu tertentu</b>: By June, I <i>will have lived</i> here for five years.</li></ol><p><b>Penanda waktu:</b> by + waktu (by 5 p.m., by tomorrow, by 2030), by the time + kalimat, before.</p><p>Kegiatan yang sedang berlangsung memakai <b>future continuous</b>. Kegiatan yang sudah selesai memakai <b>future perfect</b>.</p>`,g11B)]},
{t:'The Principal Parts of a Verb',i:'🧩',les:true,bk:2,intro:'<b>Principal parts</b> adalah bentuk dasar verb: V1 (dasar), V2 (simple past), V3 (past participle), dan V-ing (present participle).',sub:[
SB('Regular Verb',`<p>Verb beraturan: <b>V2 dan V3 sama</b>, dibentuk dengan menambah <b>-ed</b>.</p>${TBL([['walk','walked','walked','walking'],['like','liked','liked','liking'],['study','studied','studied','studying'],['play','played','played','playing'],['stop','stopped','stopped','stopping']],['V1','V2','V3','V-ing'])}<ul><li>Umumnya + <b>-ed</b>: walk → walked.</li><li>Berakhiran -e + <b>-d</b>: like → liked.</li><li>Konsonan + y → <b>-ied</b>: study → studied. Vokal + y → -ed: play → played.</li><li>Satu suku kata pola konsonan-vokal-konsonan: huruf akhir digandakan: stop → stopped.</li></ul>`,g12A),
SB('Irregular Verb',`<p>Verb tak beraturan: V2 dan V3 <b>tidak</b> dibentuk dengan -ed. Bentuknya harus dihafal. Ada tiga pola:</p>${TBL([['Pola 1','V1 = V2 = V3','cut - cut - cut'],['Pola 2','V2 = V3','buy - bought - bought'],['Pola 3','V1, V2, V3 berbeda','go - went - gone']],['Pola','Ciri','Contoh'])}<p>Kasus khusus: come - came - come, run - ran - run, become - became - become (V1 = V3).</p><p>Salah: <s>buyed</s>, <s>goed</s>, <s>eated</s>. Benar: bought, went, ate.</p>`,g12B),
SB('List of Irregular Verb',`<p><b>Pola 1: V1 = V2 = V3</b></p>${TBL(IRS.map(z=>[...z]),['V1','V2','V3','Arti'])}<p><b>Pola 2: V2 = V3</b></p>${TBL(IRT.map(z=>[...z]),['V1','V2','V3','Arti'])}<p><b>Pola 3: V1, V2, V3 berbeda</b></p>${TBL(IRA.map(z=>[...z]),['V1','V2','V3','Arti'])}<p><b>Pola khusus: V1 = V3</b></p>${TBL(IRX.map(z=>[...z]),['V1','V2','V3','Arti'])}`,g12C)]},
{t:'The Auxiliary Verb',i:'🛠️',les:true,bk:2,intro:'<b>Auxiliary verb</b> (kata kerja bantu) membantu verb utama membentuk tense, pertanyaan, negatif, dan makna tambahan.',sub:[
SB('Definition',`<p><b>Auxiliary verb</b> = <i>helping verb</i>. Letaknya <b>sebelum</b> verb utama (main verb).</p>${TBL([['She <b>is</b> reading.','is','reading'],['He <b>has</b> finished.','has','finished'],['They <b>do not</b> play.','do','play'],['I <b>can</b> swim.','can','swim']],['Kalimat','Auxiliary','Main verb'])}<ul><li>Auxiliary tidak membawa makna utama. Makna ada pada main verb.</li><li>be, have, do juga bisa menjadi main verb: She <b>has</b> a car (have = main verb).</li></ul>`,g13A),
SB('Types of Auxiliary Verbs',`${TBL([['Primary auxiliary','be: am, is, are, was, were, been, being<br>have: have, has, had<br>do: do, does, did','She <b>is</b> cooking. He <b>has</b> left. <b>Do</b> you know?'],['Modal auxiliary','can, could, may, might, will, would, shall, should, must','She <b>can</b> swim. You <b>should</b> rest.'],['Semi-modal auxiliary','need, dare, used to','He <b>used to</b> live here.']],['Jenis','Anggota','Contoh'])}<ul><li>Modal selalu diikuti verb bentuk dasar (V1): can <b>swim</b>, not can swims.</li><li>Semi-modal dibahas di Lesson 16.</li></ul>`,g13B),
SB('Usage of Auxiliary Verbs',`${TBL([['Continuous tense','be + V-ing','She <b>is reading</b>. We <b>were walking</b>.'],['Perfect tense','have/has/had + V3','He <b>has finished</b>. They <b>had left</b>.'],['Pertanyaan','do/does/did + S + V1','<b>Do</b> you like coffee? <b>Did</b> he call?'],['Negatif','do/does/did + not + V1','She <b>does not</b> speak French.'],['Pasif','be + V3','The letters <b>were written</b> yesterday.'],['Modal','modal + V1','She <b>can</b> swim. It <b>may</b> rain.']],['Fungsi','Rumus','Contoh'])}<ul><li>Modal menyatakan kemampuan, izin, kemungkinan, kewajiban, atau saran (Lesson 15).</li></ul>`,g13C)]},
{t:'Principal Auxiliary',i:'🔧',les:true,bk:2,intro:'<b>Principal auxiliary</b> adalah tiga kata kerja bantu utama: <b>be</b>, <b>have</b>, dan <b>do</b>. Ketiganya bisa menjadi main verb atau auxiliary.',sub:[
SB('BE',`${TBL([['I','am','was'],['He / She / It','is','was'],['You / We / They','are','were']],['Subjek','Present','Past'])}<p>Bentuk lain: <b>been</b> (V3), <b>being</b> (V-ing).</p>${TBL([['Main verb (linking)','She <b>is</b> a teacher. They <b>are</b> at home.'],['Auxiliary: continuous','She <b>is</b> reading.'],['Auxiliary: passive','The window <b>was</b> broken.']],['Fungsi','Contoh'])}<ul><li>Negatif: am not, isn't, aren't, wasn't, weren't.</li><li>Tanya: be di depan subjek: <b>Is</b> she happy?</li></ul>`,g14A),
SB('HAVE',`${TBL([['I / You / We / They','have','had'],['He / She / It','has','had']],['Subjek','Present','Past'])}<p>Bentuk lain: <b>had</b> (V3), <b>having</b> (V-ing).</p>${TBL([['Main verb: memiliki','She <b>has</b> a new bicycle.'],['Main verb: kegiatan','We <b>have</b> lunch at noon. I <b>have</b> a shower.'],['Auxiliary: perfect','She <b>has</b> finished. They <b>have</b> left.']],['Fungsi','Contoh'])}<ul><li>Main verb have: negatif dan tanya memakai do/does/did: She <b>doesn't have</b> a car. <b>Do</b> you <b>have</b> a pen?</li><li>Auxiliary have: have/has + V3, negatif haven't/hasn't.</li></ul>`,g14B),
SB('Do',`${TBL([['I / You / We / They','do','did'],['He / She / It','does','did']],['Subjek','Present','Past'])}<p>Bentuk lain: <b>done</b> (V3), <b>doing</b> (V-ing).</p>${TBL([['Main verb: melakukan','She <b>does</b> the homework. They <b>did</b> the dishes.'],['Auxiliary: tanya','<b>Do</b> you like tea? <b>Did</b> he call?'],['Auxiliary: negatif',"She <b>doesn't</b> like fish. We <b>didn't</b> go."],['Auxiliary: penekanan','I <b>do</b> like fish!']],['Fungsi','Contoh'])}<ul><li>Setelah do/does/did sebagai auxiliary, verb memakai V1.</li></ul>`,g14C)]},
{t:'Modal Auxiliaries',i:'🎛️',les:true,bk:2,nq:50,intro:'<b>Modal auxiliary</b> (can, could, may, might, must, should, dll.) menambah makna: kemampuan, izin, kemungkinan, kewajiban, dan saran. Modal selalu diikuti verb bentuk dasar (V1).',sub:[
SB('Can, Could, and (be) able to',`${TBL([['can','Kemampuan sekarang, izin informal','She <b>can</b> swim. <b>Can</b> I sit here?'],['could','Kemampuan masa lalu, permintaan sopan','He <b>could</b> run fast when he was ten. <b>Could</b> you help me?'],['be able to','Kemampuan di semua tense','I <b>will be able to</b> come. She <b>was able to</b> finish it.']],['Bentuk','Fungsi','Contoh'])}<ul><li>Negatif: can't (cannot), couldn't. Tanya: Can/Could + subjek + V1.</li><li>Can tidak punya bentuk future dan perfect: pakai <b>will be able to</b>, <b>has been able to</b>.</li><li><b>was/were able to</b> = berhasil pada satu kejadian tertentu.</li></ul>`,g15A),
SB('Could and could have',`${TBL([['could + V1','Permintaan sopan; kemungkinan sekarang atau nanti','<b>Could</b> you open the door? It <b>could</b> rain.'],['could have + V3','Peluang di masa lalu yang tidak terjadi','She <b>could have passed</b>, but she did not study.'],["couldn't have + V3",'Mustahil terjadi di masa lalu',"He <b>couldn't have stolen</b> it. He was abroad."]],['Bentuk','Fungsi','Contoh'])}<ul><li>Setelah <b>could have</b>, verb memakai V3.</li></ul>`,g15B),
SB('Must and Can\'t',`<p>Untuk <b>kesimpulan yang yakin</b> (kesimpulan logis dari bukti).</p>${TBL([['must + be / V1','Yakin benar (sekarang)','She has worked all night. She <b>must be</b> tired.'],["can't + be / V1",'Yakin tidak benar (sekarang)',"He is only five. He <b>can't be</b> a doctor."],['must have + V3','Yakin benar (masa lalu)','The ground is wet. It <b>must have rained</b>.'],["can't have + V3",'Yakin tidak benar (masa lalu)',"She <b>can't have entered</b>. She has no key."]],['Bentuk','Arti','Contoh'])}<ul><li>Lawan <b>must</b> untuk kesimpulan adalah <b>can't</b> (bukan mustn't).</li><li>Kurang yakin: may / might.</li></ul>`,g15C),
SB('May and Might',`${TBL([['may','Izin formal; kemungkinan (peluang sekitar 50%)','<b>May</b> I come in? It <b>may</b> rain.'],['might','Kemungkinan lebih kecil','She <b>might</b> be at home.'],['may/might have + V3','Kemungkinan di masa lalu','He <b>may have missed</b> the bus.'],['may/might not','Mungkin tidak','She <b>might not</b> come.']],['Bentuk','Fungsi','Contoh'])}<ul><li>Setelah may/might: verb bentuk dasar. Setelah may/might have: V3.</li></ul>`,g15D),
SB('Must and Have to',`${TBL([['must','Kewajiban dari pembicara; sekarang atau nanti','I <b>must</b> study tonight.'],['have to / has to','Kewajiban dari aturan atau pihak luar','Students <b>have to</b> wear uniforms. She <b>has to</b> work.'],['had to','Kewajiban masa lalu (must tidak punya past)','Yesterday, I <b>had to</b> wake up early.'],['will have to','Kewajiban masa depan','We <b>will have to</b> take a test.']],['Bentuk','Fungsi','Contoh'])}<ul><li>Tanya have to: <b>Do/Does/Did</b> + subjek + have to.</li><li>Negatif <b>don't/doesn't have to</b> = tidak perlu.</li></ul>`,g15E),
SB('Must, Mustn\'t, needn\'t',`${TBL([['must','Wajib','Passengers <b>must</b> show their tickets.'],["mustn't",'Dilarang','You <b>mustn\'t</b> touch that wire.'],["needn't",'Tidak perlu (= don\'t have to)','You <b>needn\'t</b> hurry. We have time.']],['Bentuk','Arti','Contoh'])}<ul><li><b>mustn't</b> dan <b>don't have to</b> berbeda arti: mustn't = dilarang; don't have to = tidak perlu.</li></ul>`,g15F),
SB('Should',`${TBL([['should + V1','Saran','You <b>should</b> see a doctor.'],["shouldn't + V1",'Saran: jangan',"You <b>shouldn't</b> eat so much sugar."],['should have + V3','Penyesalan atau kritik masa lalu','I <b>should have studied</b>.'],['ought to + V1','Sama dengan should','Students <b>ought to</b> respect teachers.']],['Bentuk','Fungsi','Contoh'])}<ul><li>Tanya: <b>Should</b> + subjek + V1? (meminta saran)</li></ul>`,g15G)]},
{t:'Semi-Modal Auxiliaries',i:'🧰',les:true,bk:2,intro:'<b>Semi-modal</b> (need, dare, used to) berperilaku seperti modal dalam kalimat tertentu, dan seperti verb biasa di kalimat lain.',sub:[
SB('NEED',`${TBL([["Modal need (negatif atau tanya)","You <b>needn't</b> go. <b>Need</b> I go?"],['Main verb need','She <b>needs to</b> go. They <b>don\'t need to</b> go. <b>Do</b> you <b>need to</b> go?'],['need + kata benda','I <b>need</b> a new pen.'],["needn't have + V3","You <b>needn't have bought</b> it. (sudah dibeli, ternyata tidak perlu)"]],['Bentuk','Contoh'])}<ul><li>Modal need: tanpa -s, tanpa to, dan terutama dipakai di kalimat negatif dan tanya.</li><li>Main verb need: need/needs to + V1, negatif don't/doesn't need to.</li><li>needn't = don't need to = tidak perlu.</li></ul>`,g16A),
SB('DARE',`${TBL([["Modal dare (negatif atau tanya)","I <b>daren't</b> ask him. <b>Dare</b> he say that?"],['Main verb dare','She <b>dares to</b> speak. He <b>doesn\'t dare to</b> go. They <b>didn\'t dare to</b> open it.'],['Ungkapan','<b>How dare</b> you say that! I <b>dare say</b> it will rain. (saya kira)']],['Bentuk','Contoh'])}<ul><li>Modal dare: tanpa -s, tanpa to: daren't + V1 (juga dare not).</li><li>Main verb dare: dare/dares to + V1; negatif memakai do/does/did.</li><li>Dare = berani. Daren't = tidak berani.</li></ul>`,g16B),
SB('USED TO',`${TBL([['Positif','S + used to + V1','I <b>used to</b> play football.'],['Negatif',"S + didn't use to + V1","She <b>didn't use to</b> like fish."],['Tanya','Did + S + use to + V1 ?','<b>Did</b> he <b>use to</b> live here?']],['Bentuk','Rumus','Contoh'])}<ul><li><b>Kebiasaan masa lalu</b> yang sudah berhenti: I used to walk to school.</li><li><b>Keadaan masa lalu</b> yang tidak benar lagi: He used to be shy.</li><li>Used to hanya untuk masa lalu. Kebiasaan sekarang memakai simple present.</li></ul><p><b>Jangan tertukar:</b> <b>be/get used to + V-ing</b> = terbiasa. I <b>am used to getting</b> up early.</p>`,g16C)]}
];

/* ===== GRAMMAR 3: Conditional ===== */
const CP=[['go to the market','cook rice'],['clean the room','watch TV'],['wash the dishes','listen to music'],['study English','see a movie'],['eat fried rice','drink milk'],['buy a pen','write a letter'],['take a bus','visit the museum'],['walk to school','help the teacher'],['visit the museum','paint a picture'],['swim in the pool','eat fried rice'],['play football','drink milk'],['listen to music','sing a song'],['write a letter','read a book'],['run in the park','drink milk']];
const vb13=k=>VB.find(v=>v.b+' '+v.o===k);
const CXO=f=>{const P=CP.filter(r=>{const x=vb13(r[0]);return x&&x.p!==x.b&&(!f||f(x))}),r=pick(P),s=pick(ALLH),x=vb13(r[0]),y=vb13(r[1]);return {s,x,y,p:low(s.pr),v:s.p=='s'?x.s:x.b,pp:ppOf(x),py:ppOf(y)}};
const IF1=c=>`If ${c.s.t} ${c.v} ${c.x.o}`,IF2=c=>`If ${c.s.t} ${c.x.p} ${c.x.o}`,IF3=c=>`If ${c.s.t} had ${c.pp} ${c.x.o}`;
const RS1=c=>`${c.p} will ${c.y.b} ${c.y.o}`,RS2=c=>`${c.p} would ${c.y.b} ${c.y.o}`,RS3=c=>`${c.p} would have ${c.py} ${c.y.o}`;
const WR3=[['rich','buy a new car'],['free today','go to the market'],['older','drive a car'],['a teacher','teach English'],['the headmaster','change the rules'],['a bird','fly over the sea']];
/* Lesson 1: Present Conditional */

const BK10h=[['Use “having been + V3” when the subject ___ the action before the main verb.','received',['performed','refused','repeated']],['“Having been told the truth, she felt relieved.” = “After she ___ the truth, she felt relieved.”','had been told',['told','has told','was telling']],['“Being invited” and “having been invited” differ because the second shows an ___ action.','earlier',['later','imagined','negative']],['“Having been warned, he left.” shows ___.','reason',['purpose','condition','contrast']],['The subject of the main clause is the ___ of the participle.','receiver',['doer of a different action','object','adverb']]];
const SEN10h=()=>{const n=NMX(),x=pick(VB),p=pick(PA10),q=ri(0,3);
  if(q==0)return [`${cap(gpx(x))}, ${n} met an old friend.`,KP10[0]];
  if(q==1)return [`${cap(p[1])} by ${pick(AGN10)}, ${n} felt happy.`,KP10[1]];
  if(q==2)return [`Having ${ppx10(x)} ${x.o}, ${n} went home.`,KP10[2]];
  return [`Having been ${p[1]} by ${pick(AGN10)}, ${n} felt proud.`,KP10[3]]};
const g310h=mixG(
 ()=>{const x=SEN10h();return Q(`Which kind of participle is used? “${x[0]}”`,x[1],`Jenis participle: ${x[1]}.`,KP10)},
 ()=>{const x=SEN10h();return Q(`Which kind of participle is used? “${x[0]}”`,x[1],`Jenis participle: ${x[1]}.`,KP10)},
 ()=>{const p=pick(PPS10);return Q(`Having been ___ ${p[3]}, ${p[4]}. (${p[0]})`,p[1],'Perfect participle pasif: having been + V3.',[p[0],p[2],`being ${p[1]}`,`to ${p[0]}`].filter(z=>z!==p[1]))},
 ()=>{const p=pick(PA10),n=NMX(),y=pick(VB);return Q(`Which sentence has the same meaning as: “After ${n} had been ${p[1]} by the teacher, ${pro10(n)} ${y.p} ${y.o}.”?`,`Having been ${p[1]} by the teacher, ${n} ${y.p} ${y.o}.`,'After + had been V3 → Having been + V3.',[`Having ${p[1]} by the teacher, ${n} ${y.p} ${y.o}.`,`Having been ${p[2]} by the teacher, ${n} ${y.p} ${y.o}.`,`Have been ${p[1]} by the teacher, ${n} ${y.p} ${y.o}.`])},
 ()=>{const p=pick(PPS10);return Q(`“Having been ${p[1]} ${p[3]}, ${p[4]}.” shows ___.`,'a reason (earlier action)','Perfect participle pasif sering menyatakan sebab yang terjadi lebih dulu.',['a purpose','a condition','a contrast','a future plan'])},
 bank(BK10h,x=>`Jawaban: ${x[1]}.`),bank(BK10h,x=>`Jawaban: ${x[1]}.`));

/* ===== DATA GRAMMAR 3 ===== */
const T3=[
{t:'The Present Conditional Tense',i:'🔮',les:true,bk:3,nq:30,intro:'<b>Present Conditional</b> memakai <b>would + V1</b> untuk hasil yang berandai-andai, permintaan sopan, dan masa depan dalam kalimat tidak langsung.',sub:[
SB('Form',`${TBL([['Positif','S + would + V1','I <b>would travel</b> if I were rich.'],['Negatif','S + would not (wouldn\'t) + V1',"She <b>wouldn't help</b> him."],['Tanya','Would + S + V1 ?','<b>Would</b> you come?']])}<ul><li><b>would</b> sama untuk semua subjek.</li><li>Kontraksi: I'd, she'd, wouldn't.</li><li>Setelah would, verb memakai bentuk dasar (V1).</li></ul>`,g31a),
SB('Usage',`<ol><li><b>Hasil situasi berandai-andai</b>: If I were rich, I <i>would travel</i> the world.</li><li><b>Permintaan dan tawaran sopan</b>: <i>Would</i> you open the window? <i>Would</i> you like some tea?</li><li><b>Masa depan dalam kalimat tidak langsung</b> (future in the past): He said he <i>would call</i> me.</li><li><b>Kebiasaan masa lalu</b>: When I was a child, I <i>would play</i> in the river every day.</li></ol><p>Juga: <i>I would rather</i> stay at home (lebih suka), <i>Would you mind</i> closing the door? (+ V-ing).</p>`,g31b)]},
{t:'The Perfect Conditional Tense',i:'⏮️',les:true,bk:3,nq:30,intro:'<b>Perfect Conditional</b> memakai <b>would have + V3</b> untuk hasil yang tidak terjadi di masa lalu, penyesalan, dan komentar tentang masa lalu.',sub:[
SB('Form',`${TBL([['Positif','S + would have + V3','She <b>would have passed</b>.'],['Negatif','S + would not (wouldn\'t) have + V3',"They <b>wouldn't have come</b>."],['Tanya','Would + S + have + V3 ?','<b>Would</b> he <b>have helped</b>?']])}<ul><li><b>would have</b> sama untuk semua subjek.</li><li>Kontraksi: I'd have, she'd have, wouldn't have.</li><li>Setelah have, verb memakai V3 (past participle).</li></ul>`,g32a),
SB('Usage',`<ol><li><b>Hasil yang tidak terjadi karena kondisi masa lalu berbeda</b>: If she had studied, she <i>would have passed</i>.</li><li><b>Penyesalan</b>: I <i>would have loved</i> to join you, but I was busy.</li><li><b>Komentar dengan without / but for</b>: Without your help, we <i>would have failed</i>.</li></ol><p>Semua menyatakan hal yang <b>tidak terjadi</b> di masa lalu.</p>`,g32b)]},
{t:'Conditional Sentence Type 1',i:'☔',les:true,bk:3,nq:30,intro:'<b>Conditional type 1</b> menyatakan kondisi yang <b>nyata dan mungkin terjadi</b> di masa depan: If + simple present, will + V1.',sub:[
SB('Form',`${TBL([['If-clause','If + simple present','If it <b>rains</b>,'],['Result clause','will + V1','we <b>will stay</b> at home.'],['Negatif',"won't + V1 / don't + V1","If you <b>don't hurry</b>, you <b>won't catch</b> the bus."]],['Bagian','Rumus','Contoh'])}<ul><li>If-clause dan result clause bisa dibalik: We will stay at home <b>if</b> it rains (tanpa koma).</li><li>Setelah if tidak dipakai will: <s>If it will rain</s>.</li></ul>`,g33a),
SB('Usage',`<ol><li><b>Kemungkinan di masa depan</b>: If it rains tomorrow, we will stay at home.</li><li><b>Peringatan</b>: If you touch that wire, you will get a shock.</li><li><b>Janji</b>: If you help me, I will give you a gift.</li><li><b>Tawaran atau saran</b>: If you are tired, I will drive.</li></ol>`,g33b),
SB('Variations of The Result Clause',`${TBL([['will / won\'t + V1','Hasil di masa depan','If you hurry, you <b>will catch</b> the bus.'],['can + V1','Kemampuan atau izin','If you finish early, you <b>can go</b> home.'],['should + V1','Saran','If you feel sick, you <b>should see</b> a doctor.'],['must + V1','Kewajiban','If you drive, you <b>must wear</b> a seat belt.'],['may / might + V1','Kemungkinan','If the sky is dark, it <b>may rain</b>.'],['Imperative','Perintah','If you see Budi, <b>tell</b> him.'],['Simple present','Kebenaran umum','If you heat ice, it <b>melts</b>.']],['Bentuk','Fungsi','Contoh'])}`,g33c),
SB('Variations of The If-Clause',`${TBL([['Present continuous','Kegiatan yang sedang berlangsung','If you <b>are leaving</b> now, take an umbrella.'],['Present perfect','Sudah selesai','If you <b>have finished</b>, you can go.'],['unless','= if ... not (kecuali jika)','<b>Unless</b> you hurry, you will be late.'],['should','Kemungkinan kecil, sopan','If you <b>should see</b> him, tell him to call.']],['Bentuk','Fungsi','Contoh'])}<ul><li><b>Unless</b> memakai bentuk positif: Unless you study = If you <b>don't</b> study.</li></ul>`,g33d)]},
{t:'Conditional Sentence Type 2',i:'💭',les:true,bk:3,nq:30,intro:'<b>Conditional type 2</b> menyatakan situasi yang <b>tidak nyata sekarang</b> atau kecil kemungkinannya: If + simple past, would + V1.',sub:[
SB('Form',`${TBL([['If-clause','If + simple past','If I <b>had</b> a car,'],['Result clause','would + V1','I <b>would drive</b> to school.'],['Negatif',"wouldn't + V1","If I had a car, I <b>wouldn't walk</b>."]],['Bagian','Rumus','Contoh'])}<ul><li>Untuk be, dipakai <b>were</b> untuk semua subjek (bentuk standar): If I <b>were</b> you, ...</li><li>Setelah if tidak dipakai would: <s>If I would have a car</s>.</li></ul>`,g34a),
SB('Usage',`<ol><li><b>Situasi imajiner sekarang</b>: If I had a car, I would drive to school.</li><li><b>Kemungkinan kecil di masa depan</b>: If I won the lottery, I would buy a house.</li><li><b>Saran</b>: If I were you, I would study harder.</li></ol><p>Bandingkan type 1 (nyata): If I <b>have</b> money, I <b>will</b> buy a bike.</p>`,g34b),
SB('Variations of The Result Clause',`${TBL([['would + V1','Hasil yang pasti','If I had money, I <b>would buy</b> a bike.'],['could + V1','Kemampuan atau kemungkinan','If I had a car, I <b>could drive</b> to school.'],['might + V1','Kemungkinan lebih lemah','If he tried again, he <b>might succeed</b>.']],['Bentuk','Fungsi','Contoh'])}`,g34c),
SB('Variations of The If-Clause',`${TBL([['were','Semua subjek (standar)','If I <b>were</b> you, I would apologize.'],['could','Kemampuan','If I <b>could swim</b>, I would join the race.'],['Past continuous','Kegiatan yang sedang berlangsung','If they <b>were studying</b> now, they would not answer.'],['Were + subjek','Inversi (tanpa if)','<b>Were I</b> rich, I would travel the world.']],['Bentuk','Fungsi','Contoh'])}`,g34d)]},
{t:'Conditional Sentence Type 3',i:'🕰️',les:true,bk:3,nq:30,intro:'<b>Conditional type 3</b> menyatakan situasi yang <b>tidak terjadi di masa lalu</b>: If + past perfect, would have + V3.',sub:[
SB('Form',`${TBL([['If-clause','If + past perfect (had + V3)','If she <b>had studied</b>,'],['Result clause','would have + V3','she <b>would have passed</b>.'],['Negatif',"hadn't + V3 / wouldn't have + V3","If she <b>hadn't studied</b>, she <b>wouldn't have passed</b>."]],['Bagian','Rumus','Contoh'])}<ul><li>Setelah if tidak dipakai would have: <s>If she would have studied</s>.</li></ul>`,g35a),
SB('Usage',`<ol><li><b>Hasil yang tidak terjadi</b>: If I had known, I would have told you. (Kenyataannya aku tidak tahu.)</li><li><b>Penyesalan</b>: If only I had listened to you! I wish I had saved more money.</li><li><b>Komentar dengan without / but for</b>: Without your help, we would have failed.</li></ol><p>Kenyataannya selalu <b>berlawanan</b> dengan kalimat kondisinya.</p>`,g35b),
SB('Variations of The Result Clause',`${TBL([['would have + V3','Hasil yang pasti (tidak terjadi)','If I had known, I <b>would have helped</b> you.'],['could have + V3','Peluang yang tidak terjadi','If she had studied, she <b>could have passed</b>.'],['might have + V3','Hasil yang belum pasti','If he had left early, he <b>might have caught</b> the bus.']],['Bentuk','Fungsi','Contoh'])}<p><b>must have + V3</b> bukan conditional: kesimpulan masa lalu (The ground is wet. It must have rained).</p>`,g35c),
SB('Variations of The If-Clause',`${TBL([["hadn't + V3",'Negatif',"If she <b>hadn't been</b> late, she would have caught the bus."],['had been + V-ing','Past perfect continuous','If it <b>had been raining</b>, the river would have flooded.'],['Had + subjek + V3','Inversi (tanpa if)','<b>Had I known</b>, I would have helped.'],['without / but for','Pengganti if-clause','<b>Without</b> your help, we would have failed.']],['Bentuk','Fungsi','Contoh'])}`,g35d)]},
{t:'Other Uses in \'If Clause\'',i:'🧩',les:true,bk:3,nq:30,intro:'Selain <b>if</b> biasa, ada pemakaian lain dalam kalimat pengandaian: <b>will/would</b> di if-clause, pengganti if, <b>in case</b>, dan <b>if only</b>.',sub:[
SB('Will/Would',`${TBL([['Permintaan sopan','If you <b>will/would</b> + V1, ...','If you <b>would</b> wait a moment, I will call the manager.'],['Bersikeras / kebiasaan keras kepala','If + S + <b>will</b> + V1, ...','If he <b>will</b> keep shouting, he will lose his voice.'],['Hasil yang ada di if-clause','If it <b>will/would</b> + V1, ...','If it <b>will</b> help, I will lend you my pen.']],['Fungsi','Rumus','Contoh'])}<ul><li>Pada condition biasa, <b>will tidak dipakai</b> di if-clause: If it rains, we will stay at home (bukan: If it will rain).</li><li><b>Would</b> terdengar lebih sopan daripada will.</li><li>If you will = jika Anda bersedia.</li></ul>`,g36a),
SB('If Replaced By Even If, Whether ... Or, Unless, But For, Provided (That) And Supposing, Otherwise',`${TBL([['even if','meskipun, bahkan jika','I will go <b>even if</b> it rains.'],['whether ... or','apakah ... atau','I do not know <b>whether</b> he will come <b>or</b> not.'],['unless','kecuali jika (= if ... not)','You will fail <b>unless</b> you study. (= if you do not study)'],['but for','seandainya bukan karena (diikuti kata benda)','<b>But for</b> your help, I would have failed.'],['provided (that) / providing (that)','asalkan (= only if)','You can go <b>provided that</b> you come back early.'],['supposing (that)','seandainya, bagaimana jika','<b>Supposing</b> you won a million dollars, what would you do?'],['otherwise','jika tidak, kalau tidak (di tengah kalimat)','Study hard, <b>otherwise</b> you will fail.']],['Kata','Arti','Contoh'])}<ul><li><b>Unless</b> sudah bermakna negatif, jadi verb setelahnya berbentuk positif.</li><li><b>But for</b> + kata benda; hasilnya memakai would (have + V3).</li><li><b>Otherwise</b> berdiri sendiri setelah perintah atau saran.</li></ul>`,g36b),
SB('In Case',`${TBL([['In case + klausa','Untuk berjaga-jaga','Take an umbrella <b>in case</b> it rains.'],['In case of + kata benda','Jika terjadi','<b>In case of</b> fire, use the stairs.'],['If','Hanya ketika kondisi terjadi','Take an umbrella <b>if</b> it rains. (hanya saat hujan)']],['Bentuk','Arti','Contoh'])}<ul><li>Setelah <b>in case</b> dipakai simple present untuk masa depan (bukan will): in case it rains.</li><li>Untuk masa lalu: I took an umbrella in case it rained.</li><li>Jangan tulis in case if.</li></ul>`,g36c),
SB('If Only',`${TBL([['Keinginan sekarang / masa depan','If only + simple past (were untuk semua subjek)','If only I <b>had</b> a car. If only I <b>were</b> taller.'],['Penyesalan masa lalu','If only + past perfect','If only I <b>had studied</b>.'],['Kesal / ingin ada perubahan','If only + S + would + V1','If only it <b>would</b> stop raining.']],['Fungsi','Rumus','Contoh'])}<ul><li><b>If only</b> sama dengan <b>I wish</b>, tetapi lebih kuat.</li><li>If only + would dipakai untuk orang atau benda lain, bukan untuk diri sendiri.</li></ul>`,g36d)]},
{t:'Using Wish',i:'🌠',les:true,bk:3,nq:30,intro:'<b>Wish</b> menyatakan keinginan yang <b>tidak nyata</b> atau tidak mungkin terjadi: sekarang, masa depan, atau masa lalu.',sub:[
SB('Expressing Wishes About The Present/Future',`${TBL([['Keadaan sekarang','S + wish + S + <b>simple past</b> (were)','I wish I <b>had</b> a car. I wish I <b>were</b> taller.'],['Ingin ada perubahan / kesal','S + wish + S + <b>would</b> + V1','I wish you <b>would</b> stop talking.'],['Kemampuan','S + wish + S + <b>could</b> + V1','I wish I <b>could</b> swim.'],['Harapan nyata','hope + will / present','I <b>hope</b> you will come.']],['Fungsi','Rumus','Contoh'])}<ul><li>Bentuk lampau setelah wish <b>tidak berarti masa lalu</b>; artinya tidak nyata sekarang.</li><li>Be setelah wish: <b>were</b> untuk semua subjek.</li><li>Wish + would tidak dipakai untuk subjek yang sama (bukan: I wish I would).</li><li>Jika harapan mungkin terjadi, pakai <b>hope</b>, bukan wish.</li></ul>`,g37a),
SB('Expressing Wishes About The Past',`${TBL([['Penyesalan','S + wish + S + <b>had + V3</b>','I wish I <b>had studied</b> harder.'],['Negatif','S + wish + S + <b>hadn\'t + V3</b>',"I wish I <b>hadn't eaten</b> so much."],['Kemampuan di masa lalu','S + wish + S + <b>could have + V3</b>','I wish I <b>could have gone</b>.']],['Fungsi','Rumus','Contoh'])}<ul><li>Wish masa lalu menyatakan penyesalan: kenyataannya berlawanan.</li><li>I wish I had known = kenyataannya aku tidak tahu.</li><li>I wish I hadn\'t eaten = kenyataannya aku makan terlalu banyak.</li></ul>`,g37b)]},
{t:'The Gerunds',i:'🔁',les:true,bk:3,nq:60,intro:'<b>Gerund</b> adalah bentuk <b>V-ing</b> yang berfungsi sebagai kata benda. Lesson ini punya 11 sub-bab dan kuis 60 soal.',sub:[
SB('As The Subject',`<p>Gerund bisa menjadi <b>subjek</b> kalimat dan diikuti verb tunggal.</p>${TBL([['Gerund sebagai subjek','<b>Swimming</b> is good exercise.'],['Dua gerund (jamak)','<b>Reading and writing</b> are important.'],['Dengan frasa','<b>Playing football</b> is fun.']],['Fungsi','Contoh'])}<ul><li>Verb setelah subjek gerund: <b>is</b> (tunggal), kecuali dua gerund digabung dengan and → are.</li></ul>`,g38a),
SB('As The Object Of Verbs',`<p>Verb tertentu diikuti <b>gerund</b>, verb lain diikuti <b>to + V1</b>.</p>${TBL([['+ gerund','enjoy, avoid, finish, practice, suggest, keep, consider, admit, deny, miss, imagine, risk, postpone, delay, mind, recommend'],['+ to V1','want, decide, hope, plan, promise, learn, refuse, agree, expect, need, manage, pretend, offer']],['Diikuti','Verb'])}<p>Contoh: She <b>enjoys swimming</b>. They <b>decided to leave</b>.</p>`,g38b),
SB('In Short Prohibition',`<p>Larangan singkat di papan tanda memakai <b>No + gerund</b>.</p>${TBL([['No smoking','Dilarang merokok'],['No parking','Dilarang parkir'],['No swimming','Dilarang berenang'],['No littering','Dilarang membuang sampah sembarangan'],['No talking','Dilarang berbicara']],['Tanda','Arti'])}<p>Sama artinya dengan: Do not smoke here.</p>`,g38c),
SB('As The Compound Nouns',`<p>Gerund + kata benda membentuk <b>compound noun</b> yang menunjukkan <b>tujuan</b>.</p>${TBL([['a swimming pool','kolam untuk berenang'],['a washing machine','mesin untuk mencuci'],['a waiting room','ruang untuk menunggu'],['a sleeping bag','kantong untuk tidur'],['running shoes','sepatu untuk berlari']],['Compound noun','Arti'])}<ul><li>Gerund compound: <b>a sleeping bag</b> (untuk tidur). Participle: <b>a sleeping baby</b> (bayi yang sedang tidur).</li></ul>`,g38d),
SB('After Prepositions',`<p>Setelah <b>preposisi</b> selalu dipakai gerund (bukan to + V1).</p>${TBL([['after / before','She washed her hands <b>before eating</b>.'],['without','He left <b>without saying</b> goodbye.'],['by','She learned English <b>by reading</b> novels.'],['instead of','We stayed home <b>instead of going</b> out.'],['thank you for','Thank you <b>for helping</b> me.']],['Preposisi','Contoh'])}`,g38e),
SB('After Verbs Followed By Prepositions Or Adverbial Particles',`<p>Verb + preposisi atau partikel diikuti gerund.</p>${TBL([['look forward to','I look forward to <b>seeing</b> you.'],['give up','He gave up <b>smoking</b>.'],['keep on / carry on / go on','They kept on <b>talking</b>.'],['insist on','She insists on <b>paying</b>.'],['get used to / be used to','I am used to <b>getting</b> up early.'],['apologize for','He apologized for <b>being</b> late.']],['Verb','Contoh'])}<ul><li>Dalam look forward to dan be used to, kata <b>to</b> adalah <b>preposisi</b>, bukan penanda infinitive.</li></ul>`,g38f),
SB('After Adjectives Followed By Prepositions',`${TBL([['good at','She is good at <b>singing</b>.'],['afraid of','He is afraid of <b>flying</b>.'],['interested in','They are interested in <b>learning</b> English.'],['tired of','I am tired of <b>waiting</b>.'],['proud of','She is proud of <b>winning</b>.'],['fond of / keen on','He is fond of <b>cooking</b>.']],['Adjektiva + preposisi','Contoh'])}`,g38g),
SB('After Possessive Adjective',`<p>Sebelum gerund (gaya formal) dipakai <b>possessive adjective</b>: my, your, his, her, our, their.</p>${TBL([['Do you mind <b>my</b> opening the window?','Apakah Anda keberatan jika saya membuka jendela?'],['We appreciate <b>your</b> helping us.','Kami menghargai bantuan Anda.'],['I do not like <b>his</b> shouting.','Saya tidak suka dia berteriak.']],['Contoh','Arti'])}`,g38h),
SB('After Pronoun Object',`<p>Dalam gaya informal, sebelum gerund dipakai <b>object pronoun</b>: me, him, her, us, them.</p>${TBL([['I found <b>him sleeping</b> in the garden.','found, caught, kept, left + object + V-ing'],['She caught <b>them eating</b> the cake.',''],['Do you mind <b>me opening</b> the window?','informal'],['Do you mind <b>my opening</b> the window?','formal']],['Contoh','Catatan'])}`,g38i),
SB('The Perfect Gerund',`<p>Rumus: <b>having + V3</b>. Menunjukkan tindakan yang terjadi <b>lebih dulu</b> daripada verb utama.</p>${TBL([['Positif','She denied <b>having stolen</b> the money.'],['Negatif','He regrets <b>not having studied</b>.'],['Sebagai pengganti klausa','<b>Having finished</b> the work, she went home.']],['Bentuk','Contoh'])}`,g38j),
SB('The Passive Gerund',`<p>Rumus: <b>being + V3</b>. Perfect passive: <b>having been + V3</b>.</p>${TBL([['being + V3','She likes <b>being praised</b>. I hate <b>being laughed at</b>.'],['having been + V3','He denied <b>having been invited</b>.']],['Bentuk','Contoh'])}<p>Dipakai bila subjek <b>menerima</b> tindakan.</p>`,g38k)]},
{t:'The Infinitive',i:'➡️',les:true,bk:3,nq:30,intro:'<b>Infinitive</b> adalah bentuk dasar verb, dengan <b>to</b> (full infinitive) atau tanpa <b>to</b> (bare infinitive).',sub:[

SB('I. The Present Participle (Active): A. Form',`${TBL([['Positif','V1 + <b>-ing</b>','<b>walking</b>, <b>playing</b>, <b>making</b>'],['Negatif','<b>not</b> + V-ing','<b>not walking</b>, <b>not playing</b>']],['Bentuk','Rumus','Contoh'])}<ul><li>Akhiran -e dihapus: make → <b>making</b>, write → <b>writing</b>.</li><li>Satu suku kata berpola konsonan-vokal-konsonan: huruf akhir digandakan: run → <b>running</b>, swim → <b>swimming</b>.</li><li>-ie → -ying: lie → <b>lying</b>.</li><li>Bentuknya sama dengan gerund, tetapi fungsinya sebagai adjektiva atau keterangan, bukan kata benda.</li><li>Maknanya <b>aktif</b>: benda atau orang itu yang melakukan.</li></ul>`,g310a),
SB('I. The Present Participle (Active): B. Usage',`${TBL([['Adjektiva sebelum kata benda','Dewi saw a <b>crying</b> baby.'],['Klausa relatif yang dipersingkat','The boy <b>playing</b> football is my brother. (= who is playing)'],['Keterangan waktu yang sama (subjek sama)','<b>Walking</b> to school, Budi saw a snake. (= While he was walking)'],['Setelah spend / go / catch / find','He spent two hours <b>reading</b>. They went <b>swimming</b>.'],['Bagian dari continuous tense','She is <b>cooking</b> now.']],['Fungsi','Contoh'])}<p><b>Subjek harus sama:</b> “Walking to school, Budi saw a snake” benar. “Walking to school, a snake bit Budi” salah (dangling participle).</p>`,g310b),
SB('II. The Past Participle (Passive): A. Form',`${TBL([['Regular','V1 + <b>-ed</b>','play → <b>played</b>, clean → <b>cleaned</b>'],['Irregular','V3 (dihafal)','go → <b>gone</b>, eat → <b>eaten</b>, write → <b>written</b>, break → <b>broken</b>'],['Negatif','<b>not</b> + V3','<b>not broken</b>, <b>not written</b>']],['Bentuk','Rumus','Contoh'])}${TBL([['go','went','<b>gone</b>'],['drink','drank','<b>drunk</b>'],['see','saw','<b>seen</b>'],['take','took','<b>taken</b>'],['steal','stole','<b>stolen</b>'],['give','gave','<b>given</b>'],['forget','forgot','<b>forgotten</b>'],['buy','bought','<b>bought</b>']],['V1','V2','V3'])}<p>Maknanya <b>pasif</b>: benda atau orang itu yang dikenai tindakan.</p>`,g310c),
SB('II. The Past Participle (Passive): B. Usage',`${TBL([['Adjektiva','He repaired a <b>broken</b> window.'],['Klausa pasif yang dipersingkat','The letter <b>written</b> by Dewi is on the table. (= which was written)'],['Keterangan (makna pasif)','<b>Praised</b> by the teacher, Sari felt proud. (= Because she was praised)'],['Causative: have/get + objek + V3','I had my car <b>washed</b> yesterday.'],['Passive voice dan perfect tense','The cup was <b>broken</b> by the boy.']],['Fungsi','Contoh'])}<p><b>-ing vs -ed:</b> The story is <b>boring</b> (menimbulkan rasa). I am <b>bored</b> (merasakannya). Contoh lain: interesting/interested, tiring/tired, exciting/excited.</p>`,g310d),
SB('III. The Perfect Participle (Active): A. Form',`${TBL([['Positif','<b>having</b> + V3','<b>having finished</b>, <b>having eaten</b>'],['Negatif','<b>not having</b> + V3','<b>not having finished</b>']],['Bentuk','Rumus','Contoh'])}<ul><li>Maknanya <b>aktif</b>: subjek yang melakukan tindakan.</li><li>V3 untuk verb irregular: having <b>eaten</b>, having <b>gone</b>, having <b>written</b>.</li></ul>`,g310e),
SB('III. The Perfect Participle (Active): B. Usage',`<p>Dipakai bila ada <b>dua tindakan</b> dengan <b>subjek yang sama</b>, dan tindakan pertama <b>selesai lebih dulu</b>.</p>${TBL([['After she <b>had finished</b> the work, she went home.','<b>Having finished</b> the work, she went home.'],['Because he <b>had lost</b> his key, he could not enter.','<b>Having lost</b> his key, he could not enter.'],['Because she <b>had not eaten</b>, she felt weak.','<b>Not having eaten</b>, she felt weak.']],['Kalimat panjang','Dengan perfect participle'])}<ul><li>Walking = waktu yang sama. Having walked = sudah selesai lebih dulu.</li><li>Subjek setelah koma harus pelaku participle.</li></ul>`,g310f),
