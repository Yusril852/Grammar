SB('Noun Clauses that Begin With a Question Word',`<p>Noun clause dengan <b>question word</b> berasal dari pertanyaan wh-. Urutan katanya menjadi urutan kalimat biasa.</p>${TBL([['Where does she live?','I do not know <b>where she lives</b>.'],['When did they arrive?','Please tell me <b>when they arrived</b>.'],['Why is he late?','I wonder <b>why he is late</b>.']],['Pertanyaan','Noun clause'])}<ul><li>Jangan pakai <b>do / does / did</b> di dalam noun clause: <s>where does she live</s>.</li><li>Verb menyesuaikan subjek dan tense: does live → lives, did arrive → arrived.</li><li>Dengan <b>be</b>, subjek ditaruh sebelum be: Where is she? → where she is.</li><li>Pernyataan diakhiri titik; bila kalimat utama berupa pertanyaan (Do you know ...?), akhiri dengan tanda tanya.</li></ul>`,g4dB),
SB('Noun Clause With Who, What, Whose + Be',`${TBL([['Who is that man?','I do not know <b>who that man is</b>.'],['What is your name?','Tell me <b>what your name is</b>.'],['Whose pen is this?','I wonder <b>whose pen this is</b>.'],['Who lives next door?','I wonder <b>who lives next door</b>.']],['Pertanyaan','Noun clause'])}<ul><li>Pola: <b>question word + subjek + be</b>.</li><li>Bila <b>who / what / whose</b> sendiri adalah subjek (diikuti verb), urutan kata tidak berubah.</li><li><b>Who</b> menanyakan orang, <b>what</b> menanyakan benda, <b>whose</b> menanyakan pemilik.</li></ul>`,g4dC),
SB('Noun Clause with Which Begin with If or Whether',`<p>Pertanyaan <b>yes/no</b> diubah menjadi noun clause dengan <b>if</b> atau <b>whether</b>.</p>${TBL([['Is she at home?','I wonder <b>if she is at home</b>.'],['Does he speak French?','Do you know <b>whether he speaks French</b>?'],['Will it rain?','I do not know <b>if it will rain</b>.']],['Pertanyaan','Noun clause'])}<ul><li>If dan whether umumnya sama. Urutan kata: <b>subjek + verb</b>.</li><li>Pakai <b>whether</b> (bukan if) setelah preposisi, sebelum <i>to + verb</i>, sebelum <i>or not</i>, dan di awal kalimat sebagai subjek.</li><li>Contoh: We talked about <b>whether</b> we should go. / <b>Whether</b> she will come is not clear.</li></ul>`,g4dD),
SB('Noun Clauses which Begin with That',`<p><b>That-clause</b> menyatakan fakta, pendapat, atau harapan.</p>${TBL([['Setelah verb','I know <b>that she is kind</b>.'],['Setelah adjective','We are glad <b>that you came</b>.'],['Sebagai subjek','<b>That she won</b> surprised us.'],['Sebagai pelengkap be','The problem is <b>that we have no money</b>.']],['Posisi','Contoh'])}<ul><li>Verb umum: think, know, believe, hope, say, realize, notice.</li><li><b>that</b> boleh dihilangkan bila that-clause menjadi objek: I think (that) she is right.</li><li><b>that</b> tidak boleh dihilangkan bila that-clause ada di awal kalimat.</li></ul>`,g4dE),
SB('Substituting So For a "That-Clause" in Conversational Responses',`<p>Dalam percakapan, <b>so</b> atau <b>not</b> menggantikan that-clause setelah verb tertentu.</p>${TBL([['A: Is Budi at school? B: I think <b>so</b>.','= I think that he is at school.'],['A: Will it rain? B: I hope <b>not</b>.','= I hope that it will not rain.'],['A: Is the exam difficult? B: I am afraid <b>so</b>.','= I am afraid that it is difficult.']],['Percakapan','Arti'])}<ul><li>Verb: think, believe, hope, suppose, guess, expect, imagine, be afraid.</li><li>Negatif: <b>I hope not, I guess not, I am afraid not</b>.</li><li>Untuk think dan believe: <b>I do not think so</b>, <b>I do not believe so</b>.</li></ul>`,g4dF),
SB('Other Uses of "That-Clause"',`${TBL([['Setelah noun','The <b>fact</b> that she won surprised us. / I heard the <b>news</b> that our team won.'],['Setelah adjective','I am <b>sure</b> that he will come.'],['It + be + adjective','It is <b>important</b> that she <b>be</b> on time.'],['Subjunctive setelah verb','The teacher <b>demanded</b> that we <b>be</b> on time.']],['Pola','Contoh'])}<ul><li>Noun yang sering diikuti that-clause: fact, news, idea, rumor, belief, proof, message.</li><li><b>Subjunctive</b>: setelah demand, require, request, recommend, suggest, propose, urge, advise, dan setelah <i>It is important / essential / necessary / vital that</i>, verb memakai <b>bentuk dasar</b> (tanpa -s, tanpa tense).</li><li>Negatif: that she <b>not</b> go.</li></ul>`,g4dG)]},
{t:'Adverb Clauses',i:'🌤️',les:true,bk:4,nq:30,intro:'<b>Adverb clause</b> menerangkan verb atau seluruh kalimat: waktu, sebab, pertentangan, syarat, tujuan, dan akibat. Lesson ini punya 5 sub-bab dan kuis 30 soal.',sub:[
SB('Adverb Clauses: Introduction',`<p><b>Adverb clause</b> = klausa yang menerangkan verb atau seluruh kalimat. Klausa ini <b>dependent</b>: diawali subordinator.</p>${TBL([['Time','when, while, before, after, until, as soon as','We left <b>when the rain stopped</b>.'],['Reason','because, since, as, now that','She was absent <b>because she was sick</b>.'],['Contrast','although, though, even though, whereas','<b>Although it rained</b>, we played outside.'],['Condition','if, unless, in case','<b>If you study</b>, you will pass.'],['Purpose','so that','He studies <b>so that he can win</b>.'],['Result','so ... that, such ... that','The test was <b>so difficult that nobody finished</b>.']],['Jenis','Subordinator','Contoh'])}<ul><li>Adverb clause di <b>awal</b> kalimat diikuti <b>koma</b>: When the bell rang, the students left.</li><li>Adverb clause di <b>akhir</b> kalimat biasanya tanpa koma: The students left when the bell rang.</li></ul>`,g4eA),
SB('Adverb Clauses of Time',`${TBL([['when','ketika','I will call you <b>when I arrive</b>.'],['while','selagi (bersamaan)','Budi read <b>while his mother cooked</b>.'],['before','sebelum','Wash your hands <b>before you eat</b>.'],['after','setelah','<b>After she finished</b>, she left.'],['until','sampai','Wait <b>until I come back</b>.'],['as soon as','begitu','Call me <b>as soon as you arrive</b>.']],['Kata','Arti','Contoh'])}<ul><li>Dalam time clause, masa depan memakai <b>simple present</b>, bukan will: I will call you when I <b>arrive</b> (bukan <s>will arrive</s>).</li><li>Time clause di awal kalimat diikuti koma.</li></ul>`,g4eB),
SB('Adverb Clauses of Reason',`${TBL([['because','karena','We stayed home <b>because it rained</b>.'],['since','karena','<b>Since it was late</b>, we took a taxi.'],['as','karena','<b>As nobody answered</b>, I left a message.'],['now that','karena sekarang','<b>Now that the exam is over</b>, we can relax.'],['because of','karena (+ noun)','We stayed home <b>because of the rain</b>.']],['Kata','Arti','Contoh'])}<ul><li><b>because + klausa</b>; <b>because of + noun phrase</b>.</li><li>Jangan pakai because dan so bersama: <s>Because it rained, so we stayed</s>.</li></ul>`,g4eC),
SB('Adverb Clauses of Contrast',`${TBL([['although / though / even though','+ klausa','<b>Although it rained</b>, we played outside.'],['whereas','+ klausa (membandingkan)','Budi likes tea, <b>whereas Sari likes coffee</b>.'],['despite / in spite of','+ noun phrase','We played outside <b>despite the rain</b>.']],['Kata','Pola','Contoh'])}<ul><li>Jangan pakai <b>but</b> dalam kalimat dengan although: <s>Although it rained, but we played</s>.</li><li><b>Even though</b> lebih kuat daripada although.</li><li>Bentuk benar: <b>in spite of</b> (bukan <s>in spite</s>) dan <b>despite</b> (bukan <s>despite of</s>).</li></ul>`,g4eD),
SB('Adverb Clauses of Condition, Purpose, and Result',`${TBL([['if','jika (syarat nyata)','<b>If you study hard</b>, you will pass.'],['unless','jika tidak (= if ... not)','<b>Unless you hurry</b>, you will miss the bus.'],['so that','supaya (tujuan)','She saves money <b>so that she can buy a bike</b>.'],['in case','untuk berjaga-jaga','Take an umbrella <b>in case it rains</b>.'],['so ... that','akibat (adjective/adverb)','The test was <b>so difficult that</b> nobody finished it.'],['such ... that','akibat (noun phrase)','It was <b>such a hot day that</b> we stayed inside.']],['Kata','Arti','Contoh'])}<ul><li>Dalam if-clause tentang masa depan, pakai simple present: If it rains tomorrow, we will stay home.</li><li><b>so</b> + adjective/adverb; <b>such</b> + (a/an) + adjective + noun.</li></ul>`,g4eE)]},
{t:'Quoted Speech and Reported Speech',i:'💬',les:true,bk:4,nq:60,intro:'<b>Quoted speech</b> mengutip kata-kata persis; <b>reported speech</b> menyampaikan isi ucapan. Lesson ini punya 7 sub-bab dan kuis 60 soal.',sub:[
SB('Quoted Speech',`<p><b>Quoted speech (direct speech)</b> mengutip kata-kata pembicara persis, diapit tanda kutip.</p>${TBL([['Kutipan di belakang','She said, “I am tired.”','koma setelah said; huruf kapital; titik di dalam kutip'],['Kutipan di depan','“I am tired,” she said.','koma di dalam kutip; she said huruf kecil'],['Pertanyaan','“Where are you going?” he asked.','tanda tanya di dalam kutip']],['Pola','Contoh','Aturan'])}<ul><li>Kata pertama kutipan diawali <b>huruf kapital</b>.</li><li>Tanda baca akhir kutipan ditaruh <b>di dalam</b> tanda kutip.</li><li>Reporting verb: said, asked, shouted, whispered, replied, explained.</li></ul>`,g4fA),
SB('Quoted Speech vs. Reported Speech',`<p><b>Reported speech (indirect speech)</b> menyampaikan isi ucapan tanpa tanda kutip. Pronoun, tense, dan kata keterangan waktu atau tempat ikut berubah.</p>${TBL([['Direct','Sari said, “I am hungry.”'],['Reported','Sari said that <b>she</b> was hungry.']],['Bentuk','Contoh'])}${TBL([['now','then'],['today','that day'],['tomorrow','the next day'],['yesterday','the day before'],['here','there'],['this / these','that / those'],['ago','before'],['last week','the week before'],['next week','the following week'],['tonight','that night']],['Direct','Reported'])}<ul><li>Pronoun menyesuaikan pembicara: I → she/he, my → her/his.</li><li>Reported statement tidak memakai tanda kutip.</li></ul>`,g4fB),
SB('Verb Form Usage in Reported Speech: Formal Sequence of Tenses',`<p>Bila reporting verb berbentuk lampau (said, told), tense pada klausa yang dilaporkan biasanya <b>mundur satu tingkat</b> (formal sequence of tenses).</p>${TBL([['Simple present','Simple past','“I like music.” → She said she <b>liked</b> music.'],['Present continuous','Past continuous','“I am studying.” → He said he <b>was studying</b>.'],['Present perfect','Past perfect','“I have finished.” → She said she <b>had finished</b>.'],['Simple past','Past perfect','“I bought it.” → He said he <b>had bought</b> it.'],['will / can / may','would / could / might','“I will help.” → She said she <b>would help</b>.'],['am/is/are going to','was/were going to','“I am going to leave.” → He said he <b>was going to leave</b>.']],['Direct','Reported','Contoh'])}<ul><li><b>Tidak berubah</b>: fakta umum (The earth goes around the sun), past perfect, would, could, should, might.</li><li><b>must</b> menjadi <b>had to</b> (kewajiban).</li></ul>`,g4fC),
SB('Using Say vs. Tell',`${TBL([['say','say that ...; say to + orang','She <b>said</b> that she was tired. / She <b>said to me</b> that she was tired.'],['tell','tell + orang + that ...','She <b>told me</b> that she was tired.']],['Verb','Pola','Contoh'])}<ul><li>Jangan: <s>said me</s>, <s>told that</s>, <s>told to me</s>.</li><li>Ungkapan tetap dengan <b>say</b>: say hello, say goodbye, say thank you, say sorry, say good morning.</li><li>Ungkapan tetap dengan <b>tell</b>: tell the time, tell a story, tell a joke, tell a lie, tell a secret, tell the difference.</li></ul>`,g4fD),
SB('Using Ask If',`${TBL([['Yes/no','“Do you like coffee?” → She asked <b>if I liked</b> coffee.'],['Yes/no','“Are you tired?” → He asked <b>whether I was</b> tired.'],['Wh-question','“Where do you live?” → She asked <b>where I lived</b>.']],['Jenis','Contoh'])}<ul><li>Yes/no question dilaporkan dengan <b>if</b> atau <b>whether</b>.</li><li>Urutan kata <b>subjek + verb</b>, tanpa do/does/did, tanpa tanda tanya.</li><li>Tense mundur satu tingkat dan pronoun menyesuaikan.</li></ul>`,g4fE),
SB('Using Verb + Infinitive to Reported Speech',`${TBL([['told / asked / ordered + objek + to + V1','“Open the window.” → She told me <b>to open</b> the window.'],['Negatif: not + to + V1','“Do not be late.” → He told us <b>not to be</b> late.'],['advised / warned / reminded / invited / begged + objek + to + V1','“See a doctor.” → She <b>advised me to see</b> a doctor.'],['promised / offered / refused / agreed + to + V1','“I will help you.” → He <b>offered to help</b> me.']],['Pola','Contoh'])}<ul><li>Perintah, permintaan, saran, peringatan: verb + <b>objek</b> + to-infinitive.</li><li>Janji, tawaran, penolakan, persetujuan: verb + <b>to-infinitive</b> (tanpa objek).</li></ul>`,g4fF),
SB('Some Troublesome Verbs: Advise, Suggest, and Recommend',`${TBL([['advise','advise + objek + to + V1','She <b>advised me to see</b> a doctor.'],['suggest','suggest + V-ing / suggest that + subjek + V1','He <b>suggested going</b> home. / He <b>suggested that she go</b> home.'],['recommend','recommend + V-ing / recommend that + subjek + V1','They <b>recommended taking</b> a taxi. / They <b>recommended that we take</b> a taxi.']],['Verb','Pola','Contoh'])}<ul><li>Jangan: <s>suggest to go</s>, <s>suggest me to go</s>.</li><li>Setelah suggest/recommend that, verb memakai bentuk dasar (subjunctive): that she <b>take</b>, bukan <s>takes</s>.</li></ul>`,g4fG)]}
];
const T4=[
{t:'Passive Voice Overview with Example',i:'🔄',les:true,bk:4,nq:60,intro:'<b>Passive voice</b> dipakai bila <b>tindakan atau hasilnya</b> lebih penting daripada pelakunya. Lesson ini punya 9 sub-bab dan kuis 60 soal.',sub:[
SB('Active and Passive Sentence: Introduction',`${TBL([['Active','Subjek melakukan tindakan','<b>Sari</b> cooks rice.'],['Passive','Subjek menerima tindakan','<b>Rice</b> is cooked by Sari.']],['Bentuk','Arti','Contoh'])}<ul><li>Rumus passive: <b>be + V3 (past participle)</b>.</li><li>Objek kalimat aktif menjadi subjek kalimat pasif.</li><li>Pelaku dipindah ke akhir dengan <b>by</b> (by-phrase).</li><li>Tense kalimat tidak berubah; hanya bentuk be yang menyesuaikan tense.</li></ul>`,g4aA),
SB('Tense Forms of Passive Verbs',`${TBL([['Simple present','am/is/are + V3','The cake <b>is made</b>.'],['Simple past','was/were + V3','The cake <b>was made</b>.'],['Present perfect','has/have + been + V3','The cake <b>has been made</b>.'],['Simple future','will + be + V3','The cake <b>will be made</b>.'],['Past perfect','had + been + V3','The cake <b>had been made</b>.'],['Future perfect','will + have + been + V3','The cake <b>will have been made</b>.'],['Be going to','am/is/are + going to + be + V3','The cake <b>is going to be made</b>.']],['Tense','Rumus','Contoh'])}<ul><li>Be mengikuti subjek pasif (benda yang menerima tindakan), bukan pelakunya.</li></ul>`,g4aB),
SB('The Passive Forms of The Present and Past Continuous',`${TBL([['Present continuous','am/is/are + <b>being</b> + V3','The road <b>is being repaired</b>.'],['Past continuous','was/were + <b>being</b> + V3','The road <b>was being repaired</b> when we passed.']],['Tense','Rumus','Contoh'])}<ul><li>Continuous pasif memakai <b>being</b> (bukan been).</li><li>Present continuous: sedang berlangsung. Past continuous: sedang berlangsung di masa lampau.</li></ul>`,g4aC),
SB('Passive Modal Auxiliaries',`${TBL([['Modal + be + V3','The homework <b>must be done</b>.'],['Can / could','The work <b>can be finished</b> today.'],['Should / may / might / would','The window <b>should be closed</b>.'],['Have to / has to','The room <b>has to be cleaned</b>. The dishes <b>have to be washed</b>.'],['Ought to','The rules <b>ought to be followed</b>.']],['Bentuk','Contoh'])}<ul><li>Setelah modal pasif selalu dipakai <b>be</b> (bukan been atau being).</li></ul>`,g4aD),
SB('Summary: Passive Verb Forms',`${TBL([['Simple present','am/is/are + V3'],['Simple past','was/were + V3'],['Present perfect','has/have + been + V3'],['Simple future','will + be + V3'],['Past perfect','had + been + V3'],['Future perfect','will + have + been + V3'],['Be going to','am/is/are + going to + be + V3'],['Present continuous','am/is/are + being + V3'],['Past continuous','was/were + being + V3'],['Modal','modal + be + V3']],['Tense','Rumus passive'])}<ul><li>Verb utama selalu V3.</li><li>Tense yang memakai have di aktif memakai <b>been</b> di pasif.</li><li>Continuous memakai <b>being</b>.</li></ul>`,g4aE),
SB('Transitive and Intransitive Verbs',`${TBL([['Transitive','Punya objek langsung, <b>bisa</b> dipasifkan','Sari <b>cooks</b> rice. → Rice is cooked.'],['Intransitive','Tanpa objek, <b>tidak bisa</b> dipasifkan','The accident <b>happened</b>. (bukan: was happened)']],['Jenis','Aturan','Contoh'])}<ul><li>Verb intransitif umum: happen, occur, arrive, go, come, sleep, die, rise, fall, appear, seem, stay, exist.</li></ul>`,g4aF),
SB('Negative and Questions',`${TBL([['Negatif','be + not + V3','The cake <b>was not made</b>. The work <b>won\'t be finished</b>.'],['Pertanyaan','Be + subjek + V3 ?','<b>Was</b> the cake made by Sari?'],['Perfect','Has/Have + subjek + been + V3 ?','<b>Has</b> the work <b>been</b> finished?'],['Modal','Modal + subjek + be + V3 ?','<b>Can</b> the room <b>be</b> cleaned today?'],['Wh-question','Who ... by? / By whom ... ?','<b>By whom</b> was the book written?']],['Bentuk','Rumus','Contoh'])}<ul><li>Auxiliary pertama dipindah ke depan subjek untuk membuat pertanyaan. Tidak memakai do/does/did.</li></ul>`,g4aG),
SB('Using The "By-Phrase"',`${TBL([['By-phrase dipertahankan','Pelaku penting atau informasi baru','<b>Hamlet</b> was written <b>by Shakespeare</b>.'],['By-phrase dihilangkan','Pelaku tidak diketahui, tidak penting, atau sudah jelas','My bicycle <b>was stolen</b>. (tidak tahu siapa)']],['Keadaan','Aturan','Contoh'])}<ul><li>Hilangkan by someone, by people, by them.</li><li>By dipakai untuk pelaku; with untuk alat.</li></ul>`,g4aH),
SB('Stative Passive (Using Past Participles as Adjectives)',`${TBL([['Dynamic passive','Tindakan oleh pelaku','The door <b>was closed</b> by the guard.'],['Stative passive','Keadaan (V3 sebagai adjektiva)','The door <b>is closed</b>. (keadaannya tertutup)']],['Jenis','Arti','Contoh'])}${TBL([['be interested in','She is interested in music.'],['be married to','He is married to a doctor.'],['be tired of','I am tired of waiting.'],['be excited about','They are excited about the trip.'],['be surprised at','We were surprised at the result.'],['be satisfied with','I am satisfied with the answer.'],['be worried about','She is worried about the exam.'],['be made of / filled with / covered with / known for','The table is made of wood.']],['Pola','Contoh'])}`,g4aI)]}
];

const BOOKS=[{n:'Grammar 1',d:'10 lesson · 40 sub-bab · materi + 800 soal',ok:true,c:1},{n:'Grammar 2',d:'16 lesson · 56 sub-bab · materi + kuis',ok:true,c:2},{n:'Grammar 3',d:'10 lesson · 44 sub-bab · materi + kuis',ok:true,c:3},{n:'Grammar 4',d:'6 lesson · 39 sub-bab · materi + kuis',ok:true,c:4}];
const openBook=n=>{BK=n;go('home')};
W.buku=()=>`<section class="hero"><div style="flex:1"><div class="lvb">Level ${lvOf(S)} · ${S.xp} XP</div><h1>Halo, ${esc(S.n)}!</h1></div><div style="font-size:64px">📚</div></section>
<h2>Pilih Buku</h2><div class="books">${BOOKS.map(b=>b.ok?`<button class="book" onclick="openBook(${b.c})" aria-label="Buka ${b.n}"><img src="${COVERS[b.c]}" alt="Sampul ${b.n}"><b>${b.n}</b><small>${b.d}</small></button>`:`<div class="book off" aria-disabled="true"><img src="${COVERS[b.c]}" alt="Sampul ${b.n}"><span class="rib">Segera hadir</span><b>${b.n}</b></div>`).join('')}</div></div>
<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>🧠 Peta Konsep</b><p style="margin:2px 0 0;color:var(--mut)">Lihat bagaimana lesson di Grammar 1 sampai 4 saling terhubung.</p></div><button class="btn" onclick="go('peta')">Buka peta</button></div>`;
/* ========= BERANDA ========= */
const lvOf=s=>Math.floor(s.xp/100)+1;
const accOf=s=>s.tot?Math.round(s.ok/s.tot*100):0;
const ACH=[['🌱','Langkah Pertama',s=>s.tot>=1],['🔥','3 Hari Beruntun',s=>(s.bs||0)>=3],['💯','Nilai Sempurna',s=>s.perf],['⚡','500 XP',s=>s.xp>=500],['🏅','Satu Lesson Selesai',s=>T.some((c,b)=>c.les?!!s.st[b+'_mix']:c.sub.every((_,i)=>s.st[`${b}_${i}_0`]))]];
function chapCard(b,i){const d=lesDone(b),n=lesTot(b),ok=d===n;
  return `<button class="chap" style="--h:${b*36+150};animation-delay:${i*.05}s" onclick="go('kelas',${b})"><span class="ic">${CI[b]}</span><h3>Lesson ${lno(b)}. ${esc(CH[b])}${ok?' ✅':''}</h3><small>${T[b].les?(ok?'Kuis selesai':'Belajar + kuis · '+T[b].sub.length+' sub-bab'):d+'/'+n+' sub-bab selesai'}</small><div class="xpb" style="min-width:0"><i style="width:${d/n*100}%"></i></div></button>`}
W.home=()=>{
  const ses=S.ses,pc=ses?Math.round((ses.i+1)/ses.qs.length*100):0;
  return `<section class="hero"><div style="flex:1"><div class="lvb">Level ${lvOf(S)}</div><h1>Halo, ${esc(S.n)}!</h1><div class="xpb" aria-label="Progres XP"><i style="width:${S.xp%100}%"></i></div><small>${S.xp%100}/100 XP menuju level berikutnya</small></div><div style="font-size:64px">📚</div></section>
<div class="stats"><div class="stat"><b>🔥 ${S.streak}</b>Streak hari</div><div class="stat"><b>${S.tot}</b>Soal</div><div class="stat"><b>${accOf(S)}%</b>Akurasi</div><div class="stat"><b>${S.xp}</b>XP</div><div class="stat"><b>${BT().filter(b=>lesDone(b)===lesTot(b)).length}/${BT().length}</b>Lesson selesai</div></div>
${ses?`<div class="card" style="border-color:var(--acc)"><b>Ada sesi yang belum selesai</b><div style="color:var(--mut)">${ses.ul?'Ulangan mandiri':esc(sbn(ses.b,ses.s))} · soal ${ses.i+1}/${ses.qs.length}</div><div class="bar" style="margin:8px 0"><i style="width:${pc}%"></i></div><div class="row"><button class="btn" onclick="resume()">Lanjutkan</button><button class="btn s" onclick="delSes()">Hapus sesi</button></div></div>`:''}
<h2>Daftar Lesson</h2><div class="grid">${BT().map((m,i)=>chapCard(m,i)).join('')}</div>
<h2>Pencapaian</h2><div class="chips">${ACH.map(a=>`<span class="chip ${a[2](S)?'on2':''}" style="${a[2](S)?'':'opacity:.5'}">${a[0]} ${a[1]}</span>`).join('')}</div>
<h2>Leaderboard Top 10</h2>${lbHtml()}`;
};
function lbHtml(){
  const L=LB.list;if(!L.length)return '<div class="card">Belum ada data.</div>';
  const pod=[1,0,2].filter(i=>L[i]).map(i=>`<div class="pod p${i+1}"><div style="font-size:26px">${['👑','🥈','🥉'][i]}</div><b>${esc(L[i].n)}</b><div>${L[i].xp} XP</div></div>`).join('');
  return `<div class="podium">${pod}</div>${L.length>3?`<div class="card tbl-w"><table class="tbl">${L.slice(3,10).map((x,i)=>`<tr><td>${i+4}</td><td>${esc(x.n)}</td><td>${x.xp} XP</td></tr>`).join('')}</table></div>`:''}`;
}
async function lbLoad(){
  if(Date.now()-LB.t<30000)return;LB.t=Date.now();let m={};
  try{if(DB){m=(await DB.ref(`${APP}/ringkas`).once('value')).val()||{}}else m=sg(LSS,{})}catch(e){m=sg(LSS,{})}
  const list=Object.values(m).sort((a,b)=>b.xp-a.xp).slice(0,10);const a=JSON.stringify(list),b=JSON.stringify(LB.list);LB.list=list;
  if(a!==b&&V==='home'){const y=scrollY;render();scrollTo(0,y)}
}
function resume(){P=J(S.ses);if(P.ul){P.end=Date.now()+(P.left||0)*1000;V='xplay'}else V='play';render();scrollTo(0,0)}
function delSes(){if(!confirm('Hapus sesi yang belum selesai?'))return;S.ses=null;P=null;sv();render()}

/* ========= KELAS (daftar sub-bab) ========= */
function exOf(b,s){const k=b+'_'+s;if(!EX[k])EX[k]=T[b].sub[s].g[0]();return EX[k]}
W.kelas=()=>{
  const c=T[G];
  if(c.les)return kelasL();
  return `<div class="row"><button class="btn s" onclick="go('home')">‹ Grammar ${BK}</button></div><h2>${CI[G]} Lesson ${lno(G)}. ${esc(c.t)}</h2><div class="card"><b>${lesDone(G)}/${c.sub.length} sub-bab selesai</b>${lesDone(G)===c.sub.length?' ✅ Lesson tuntas!':''}<div class="bar" style="margin-top:8px"><i style="width:${lesDone(G)/c.sub.length*100}%"></i></div></div>
<div class="card">${c.intro?`<p style="margin:0 0 10px">${c.intro}</p>`:''}<div class="row"><button class="btn" onclick="go('belajar',${G})">📖 Belajar</button></div></div>
${c.sub.map((sb,s)=>{const ex=exOf(G,s);return `<div class="card"><h3>${String.fromCharCode(65+s)}. ${esc(sb.n)}${subDone(G,s)?' <span class="pill" style="background:var(--ok);color:#fff">✓ Selesai</span>':''}</h3>
<details><summary>📖 Materi &amp; contoh soal</summary><div class="mat">${sb.m}</div><div class="mat"><b>Contoh:</b><br>${qh(ex.q)}<br><b>Jawaban:</b> ${esc(ex.a)}<br><small>${esc(ex.e)}</small></div></details>
<div class="row" style="margin-top:10px">${(()=>{const k=`${G}_${s}_0`,st=S.st[k],a=S.ac[k],ses=S.ses&&!S.ses.ul&&S.ses.b===G&&S.ses.s===s;
  const stt=ses?`Lanjut soal ${S.ses.i+1}/${S.ses.qs.length}`:st?`${'★'.repeat(st.s)}${'☆'.repeat(3-st.s)} · terbaik ${st.b}`:a?`${a.n} soal dijawab`:'20 soal';
  return `<button class="lv l0" onclick="${ses?'resume()':`start(${G},${s},0)`}">Mulai latihan<small>${stt}</small></button>`})()}</div></div>`}).join('')}
<div class="card"><h3>🎲 Ulangan Campuran Lesson ${lno(G)}</h3><p style="margin:0 0 8px;color:var(--mut)">20 soal acak dari semua sub-bab.</p><button class="btn" onclick="startMix(${G})">Mulai</button></div>`;
};
function kelasL(){
  const c=T[G],st=S.st[G+'_mix'],ses=S.ses&&!S.ses.ul&&S.ses.b===G&&S.ses.s<0,done=lesDone(G)===1;
  const stt=ses?`Lanjut soal ${S.ses.i+1}/${S.ses.qs.length}`:st?`${'★'.repeat(st.s)}${'☆'.repeat(3-st.s)} · terbaik ${st.b}`:`${nq(G)} soal`;
  return `<div class="row"><button class="btn s" onclick="go('home')">‹ Grammar ${BK}</button></div><h2>${CI[G]} Lesson ${lno(G)}. ${esc(c.t)}${done?' ✅':''}</h2>
<div class="card"><p style="margin:0 0 10px">${c.intro}</p><ol style="margin:0 0 12px;padding-left:20px">${c.sub.map((sb,s)=>`<li>${esc(sb.n)}</li>`).join('')}</ol>
<div class="row"><button class="btn" onclick="go('belajar',${G})">📖 Belajar</button></div></div>
<div class="card"><h3>📝 Kuis Lesson ${lno(G)}</h3><p style="margin:0 0 8px;color:var(--mut)">${nq(G)} soal dari semua sub-bab. Baca materi dulu, lalu kerjakan.</p>
<button class="lv l0" onclick="${ses?'resume()':`startMix(${G})`}">Mulai kuis<small>${stt}</small></button></div>`;
}

function runVal(){
  const issues=[],books=BOOKS.map(k=>({c:k.c,n:k.n,d:k.d,ls:[],lat:0,kuis:0,iss:0}));
  T.forEach((c,b)=>{
    const B=books.find(x=>x.c===(c.bk||1)),L={no:lno(b),t:c.t,les:!!c.les,subs:[],lat:0,kq:0,iss:0,kqIss:0},tag0=lbl(b);
    const add=(msg,o)=>{issues.push(msg);o.iss++;L.iss++;B.iss++};
    c.sub.forEach((sb,s)=>{const o={n:sb.n,q:0,iss:0},qs=genSet(b,s,0,20),tag=`${tag0}.${s+1}`;o.q=qs.length;
      if(qs.length<20)add(`${tag}: hanya ${qs.length} soal unik`,o);
      qs.forEach((q,i)=>{if(!q.o.includes(q.a))add(`${tag} #${i+1}: jawaban tidak ada di opsi`,o);if(new Set(q.o).size!==q.o.length)add(`${tag} #${i+1}: opsi ganda`,o);if(q.o.length<4||q.bad)add(`${tag} #${i+1}: pengecoh kurang — ${q.q}`,o)});

    if(c.les){const o={n:'Kuis lesson',q:0,iss:0},qs=genMix(b,nq(b)),tag=`${tag0} kuis`;o.q=qs.length;L.kq=qs.length;
      if(qs.length<nq(b))add(`${tag}: hanya ${qs.length} soal`,o);
      const cnt={};qs.forEach(q=>cnt[q.s]=(cnt[q.s]||0)+1);c.sub.forEach((_,s)=>{L.subs[s].q=cnt[s]||0;if(!cnt[s])add(`${tag}: sub-bab ${s+1} tidak terwakili`,o)});
      qs.forEach((q,i)=>{if(!q.o.includes(q.a)||new Set(q.o).size!==q.o.length||q.o.length<4||q.bad)add(`${tag} #${i+1}: ${q.q}`,o)});
      L.kqIss=o.iss;L.kuisRow=o}
    B.ls.push(L);B.lat+=L.lat;B.kuis+=L.kq});

  VR={issues,books};render();
}

  const tl=sum(VR.books,b=>b.ls.length),ts=sum(VR.books,b=>sum(b.ls,l=>l.subs.length)),tlat=sum(VR.books,b=>b.lat),tk=sum(VR.books,b=>b.kuis),ti=VR.issues.length;
  const det=VR.books.map(b=>{
    if(!b.ls.length)return `<div class="card"><h3>${esc(b.n)}</h3><p style="margin:0">Belum ada lesson (${esc(b.d)}). Lesson: 0 · Sub-bab: 0 · Soal: 0 · Temuan: 0.</p></div>`;
    const sb=sum(b.ls,l=>l.subs.length);
    return `<div class="card"><h3>${esc(b.n)}</h3><p style="margin:0 0 8px">${b.ls.length} lesson · ${sb} sub-bab · ${b.lat?`<b>${nf(b.lat)}</b> soal latihan`:'tanpa soal latihan per sub-bab'}${b.kuis?` · <b>${nf(b.kuis)}</b> soal kuis`:''} · total <b>${nf(b.lat+b.kuis)}</b> soal · temuan ${b.iss}</p>${b.c===1?'<p style="margin:0 0 8px;color:var(--mut)">Grammar 1: tiap sub-bab 20 soal latihan. Ulangan campuran memakai soal dari sub-bab yang sama, jadi tidak dihitung dua kali.</p>':b.c===4?'<p style="margin:0 0 8px;color:var(--mut)">Grammar 4: tidak ada soal latihan per sub-bab. Soal hanya berupa 1 kuis per lesson (Lesson 1 = 60 soal, Lesson 2 = 30 soal, Lesson 3 = 60 soal) yang diambil seimbang dari semua sub-bab. Generator tiap sub-bab tetap diperiksa (20 soal unik) tetapi tidak dihitung sebagai soal.</p>':b.c===3?'<p style="margin:0 0 8px;color:var(--mut)">Grammar 3: tidak ada soal latihan per sub-bab. Soal hanya berupa 1 kuis per lesson (30 soal; Lesson 8 Gerunds 60 soal) yang diambil seimbang dari semua sub-bab. Generator tiap sub-bab tetap diperiksa (20 soal unik) tetapi tidak dihitung sebagai soal.</p>':'<p style="margin:0 0 8px;color:var(--mut)">Grammar 2: tidak ada soal latihan per sub-bab. Soal hanya berupa 1 kuis per lesson (20 soal; Lesson 15 = 50 soal) yang diambil seimbang dari semua sub-bab. Generator tiap sub-bab tetap diperiksa (20 soal unik) tetapi tidak dihitung sebagai soal.</p>'}`+b.ls.map(l=>`<details><summary>Lesson ${l.no}. ${esc(l.t)} · ${l.subs.length} sub-bab · ${nf(l.lat+l.kq)} soal · ${l.iss?`<span class="red">${l.iss} temuan</span>`:'✓'}</summary>${TBL([...l.subs.map((o,i)=>[String.fromCharCode(65+i)+'. '+esc(o.n),o.q,o.iss||'✓']),['<b>'+(l.les?'Jumlah soal kuis':'Jumlah')+'</b>','<b>'+(l.lat+l.kq)+'</b>','<b>'+(l.iss||'✓')+'</b>']],['Sub-bab',l.les?'Soal di kuis':'Soal latihan','Temuan'])}</details>`).join('')+`</div>`;
  }).join('');
  const iss=ti?`<div class="card"><h3>Temuan: ${ti}</h3>${VR.issues.slice(0,40).map(x=>`<div class="red">• ${esc(x)}</div>`).join('')}</div>`:`<div class="card"><div class="grn">✓ Semua soal lolos pemeriksaan (0 temuan).</div></div>`;
  const tot=`<div class="card"><h3>📊 Total keseluruhan</h3>${TBL([...VR.books.map(b=>[esc(b.n).replace('Grammar ','G'),b.ls.length,sum(b.ls,l=>l.subs.length),nf(b.lat),nf(b.kuis),'<b>'+nf(b.lat+b.kuis)+'</b>',b.ls.length?(b.iss||'✓'):'–']),['<b>Total</b>','<b>'+tl+'</b>','<b>'+ts+'</b>','<b>'+nf(tlat)+'</b>','<b>'+nf(tk)+'</b>','<b>'+nf(tlat+tk)+'</b>','<b>'+(ti||'✓')+'</b>']],['Buku','Lesson','Sub','Latihan','Kuis','Total','⚠️'])}<p style="margin:8px 0 0">Sub = sub-bab. ⚠️ = jumlah temuan. Grammar 2, 3, dan 4 hanya punya kuis per lesson, tanpa latihan per sub-bab.</p></div>`;
  return iss+det+tot;
}

/* ========= TEMA, PARTIKEL, CONFETTI ========= */
const TH=[['samudra','Samudra','🫧'],['synthwave','Synthwave','✦'],['sakura','Sakura','🌸'],['kode','Kode Hijau','is/are'],['light','Terang','☀️'],['dark','Gelap','🌙']];
function setTheme(t,save){document.documentElement.dataset.theme=t;if(save)try{localStorage.setItem(LST,t)}catch(e){}particles(t);
  $('#thp').innerHTML=TH.map(x=>`<button class="${x[0]===t?'on':''}" onclick="setTheme('${x[0]}',true)">${x[1]}</button>`).join('')}
function particles(t){const ch=(TH.find(x=>x[0]===t)||TH[0])[2],list=t=='kode'?['is','are','-s','-ed','-ing','a','an']:[ch];
  $('#bg').innerHTML=rm()?'':Array.from({length:14},(_,i)=>`<span style="left:${ri(0,96)}%;animation-duration:${ri(14,30)}s;animation-delay:-${ri(0,25)}s">${list[i%list.length]}</span>`).join('')}
$('#thb').onclick=()=>{const p=$('#thp');p.hidden=!p.hidden};
function confetti(){
  if(rm())return;const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:Math.random()*4-2,vy:Math.random()*3+3,c:`hsl(${ri(0,360)} 90% 60%)`,s:ri(5,10)}));let f=0;
  (function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
}

/* ========= MULAI ========= */
(async function init(){
  const th=tsg(LST),t=th&&TH.some(x=>x[0]===th)?th:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'samudra');
  setTheme(t,false);render();await fbInit();updSy();
})();
</script>
