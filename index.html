<script>

function Q(q,a,e,c,img){
  const ds=sh([...new Set(c)]).filter(x=>x&&x!==a).slice(0,3);

}
const qk=q=>q.q+'|'+q.a;
function genSet(b,s,l,n=20,pv=[]){
  const f=T[b].sub[s].g[l],seen=new Set,out=[];let t=0;
  while(out.length<n&&t<n*60){t++;const q=f(),k=qk(q);

}

  while(out.length<n&&t<n*60){t++;const s=ri(0,T[b].sub.length-1),l=0,q=T[b].sub[s].g[l](),k=qk(q);
    if(seen.has(k)||(t<n*30&&pv.includes(k)))continue;seen.add(k);q.b=b;q.s=s;q.l=l;out.push(q)}

v('go','goes','went','going','to the market',1),v('eat','eats','ate','eating','fried rice',1),v('drink','drinks','drank','drinking','milk',1),v('write','writes','wrote','writing','a letter',1),v('read','reads','read','reading','a book',1),v('buy','buys','bought','buying','a pen',1),v('see','sees','saw','seeing','a movie',1),v('take','takes','took','taking','a bus',1),v('swim','swims','swam','swimming','in the pool',1),v('run','runs','ran','running','in the park',1),v('sing','sings','sang','singing','a song',1),v('make','makes','made','making','a cake',1)];

/* ========= GAMBAR SVG (preposisi tempat) ========= */
function svgRel(r){
  const box=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${f||'#c9d6e2'}" stroke="#6b7f95" stroke-width="3"/>`;
  const ball=(x,y,rr=13)=>`<circle cx="${x}" cy="${y}" r="${rr}" fill="#ff9f1c" stroke="#b36b00" stroke-width="3"/>`;
  let g='';
  if(r=='on')g=box(60,70,80,52)+ball(100,57);

SB('Form',`<p>Bentuk dasar simple present (V1):</p>${TBL([['Positif','S + V1 (+s/es untuk he/she/it)','She <b>plays</b> football. They <b>play</b> football.'],['Negatif','S + do not / does not + V1',"She <b>doesn't play</b> football. They <b>don't play</b>."],['Tanya','Do / Does + S + V1 ?','<b>Does</b> she <b>play</b> football?'],['To be','I <b>am</b>, he/she/it <b>is</b>, you/we/they <b>are</b>','She <b>is</b> a teacher. They <b>are</b> students.']])}<ul><li>Akhiran <b>-s/-es</b> hanya untuk he, she, it, atau subjek tunggal.</li><li>Verb berakhiran s, sh, ch, x, o → <b>-es</b> (watch→watches, go→goes).</li><li>Konsonan + y → <b>-ies</b> (study→studies). Vokal + y → hanya -s (play→plays).</li><li>Setelah does/doesn't, verb kembali ke bentuk dasar: She doesn't <b>play</b> (bukan plays).</li></ul>`,g1A),

{t:'The Present Perfect Continuous Tense',i:'⏳',les:true,bk:2,intro:'<b>Present Perfect Continuous</b> menyatakan kegiatan yang dimulai di masa lalu dan masih berlangsung, atau baru saja berhenti dengan hasil yang terlihat.',sub:[
SB('Form',`${TBL([['Positif','S + have/has + been + V-ing','I <b>have been studying</b>. She <b>has been studying</b>.'],['Negatif','S + have/has + not + been + V-ing',"They <b>haven't been studying</b>. He <b>hasn't been studying</b>."],['Tanya','Have/Has + S + been + V-ing ?','<b>Has</b> she <b>been studying</b>?']])}<ul><li><b>has</b> untuk he, she, it, dan subjek tunggal. <b>have</b> untuk I, you, we, they, dan subjek jamak.</li><li>Kontraksi: I've been, she's been, haven't, hasn't.</li><li>Penulisan -ing sama dengan present continuous (make → making, run → running).</li></ul>`,g6A),
SB('Usage',`<ol><li><b>Kegiatan mulai di masa lalu dan masih berlangsung</b>: I <i>have been waiting</i> for two hours.</li><li><b>Kegiatan baru saja berhenti, hasilnya terlihat</b>: Her eyes are red. She <i>has been crying</i>.</li><li><b>Kegiatan berulang sampai sekarang</b>: I <i>have been reading</i> a lot of novels lately.</li></ol><p><b>Penanda waktu:</b> for, since, all day, lately, recently, How long...?</p><p><b>for</b> + lamanya (for two hours). <b>since</b> + titik awal (since morning, since 2020).</p>`,g6B),
SB('Present Perfect Continuous Tense: Short Answers to Questions',`<p>Jawaban singkat memakai have/has saja. <b>Been dan V-ing tidak diulang.</b></p>${TBL([['Have you been waiting?','Yes, I <b>have</b>.',"No, I <b>haven't</b>."],['Has she been studying?','Yes, she <b>has</b>.',"No, she <b>hasn't</b>."],['Have they been working?','Yes, they <b>have</b>.',"No, they <b>haven't</b>."]],['Pertanyaan','Positif','Negatif'])}`,g6C),
SB('Using the Present Perfect Continuous and the Present Perfect',`${TBL([['Present Perfect Continuous','Fokus pada kegiatan dan lamanya','She <b>has been cooking</b> for two hours.'],['Present Perfect','Fokus pada hasil, jumlah, atau selesai','She <b>has cooked</b> three dishes.']],['Bentuk','Fokus','Contoh'])}<ul><li><b>How long</b> → present perfect continuous.</li><li><b>How many / How much</b> → present perfect.</li><li><b>Stative verb</b> (know, like, love, want, need, understand, believe) tidak dipakai continuous: I <b>have known</b> her since 2015 (bukan have been knowing).</li></ul>`,g6D)]},
{t:'The Past Perfect Tense',i:'⌛',les:true,bk:2,intro:'<b>Past Perfect</b> menyatakan kegiatan yang sudah selesai sebelum kegiatan atau waktu lampau lainnya.',sub:[
SB('Form',`${TBL([['Positif','S + had + V3','She <b>had finished</b> her homework.'],['Negatif','S + had not (hadn'+"'"+'t) + V3',"They <b>hadn't finished</b> the work."],['Tanya','Had + S + V3 ?','<b>Had</b> he <b>finished</b> the report?']])}<ul><li><b>had</b> dipakai untuk semua subjek.</li><li>Kontraksi: I'd, she'd, hadn't.</li><li>V3 beraturan: -ed. V3 tak beraturan: lihat Lesson 12.</li></ul>`,g7A),
SB('Usage',`<ol><li><b>Selesai sebelum kegiatan lampau lain</b>: When I arrived, the film <i>had started</i>.</li><li><b>Selesai sebelum waktu tertentu di masa lalu</b>: They <i>had finished</i> by 5 o'clock.</li><li><b>Alasan atau latar suatu kejadian</b>: We could not enter because the shop <i>had closed</i>.</li></ol><p><b>Penanda:</b> before, by the time, already, after, until then, by + waktu.</p><p>Kegiatan yang lebih dulu → <b>past perfect</b>. Kegiatan yang kemudian → <b>simple past</b>.</p>`,g7B),
SB('Using the Past Perfect and the Present Perfect',`${TBL([['Past Perfect','had + V3','Terjadi sebelum waktu lampau: By 2019, they <b>had lived</b> there for ten years.'],['Present Perfect','have/has + V3','Terkait sekarang: They <b>have lived</b> here for ten years.']],['Bentuk','Rumus','Pemakaian'])}<ul><li>Ada titik waktu lampau (when I arrived, by the time) → <b>had</b>.</li><li>Terkait sekarang (now, already, so far) → <b>have/has</b>.</li></ul>`,g7C),
SB('Past Perfect Tense: Short Answers to Questions',`<p>Jawaban singkat memakai <b>had</b>. Verb utama tidak diulang.</p>${TBL([['Had you finished?','Yes, I <b>had</b>.',"No, I <b>hadn't</b>."],['Had she finished?','Yes, she <b>had</b>.',"No, she <b>hadn't</b>."],['Had they finished?','Yes, they <b>had</b>.',"No, they <b>hadn't</b>."]],['Pertanyaan','Positif','Negatif'])}`,g7D)]},
{t:'The Past Perfect Continuous Tense',i:'🕰️',les:true,bk:2,intro:'<b>Past Perfect Continuous</b> menyatakan kegiatan yang sudah berlangsung selama beberapa waktu sampai suatu saat di masa lalu.',sub:[
SB('Form',`${TBL([['Positif','S + had + been + V-ing','She <b>had been studying</b> for two hours.'],['Negatif','S + had not (hadn'+"'"+'t) + been + V-ing',"They <b>hadn't been working</b>."],['Tanya','Had + S + been + V-ing ?','<b>Had</b> he <b>been waiting</b>?']])}<ul><li><b>had</b> dipakai untuk semua subjek.</li><li>Kontraksi: I'd been, she'd been, hadn't been.</li><li>Penulisan -ing sama dengan present continuous.</li></ul>`,g8A),
SB('Usage',`<ol><li><b>Kegiatan berlangsung sampai suatu saat di masa lalu</b>: I <i>had been waiting</i> for two hours when the bus came.</li><li><b>Kegiatan baru berhenti, hasilnya terlihat saat itu</b>: Her eyes were red. She <i>had been crying</i>.</li><li><b>Alasan suatu keadaan di masa lalu</b>: She was tired because she <i>had been working</i> all day.</li></ol><p><b>Penanda:</b> for, since, all day, how long, when + kejadian lampau, before.</p><p><b>Stative verb</b> (know, like, want) tidak dipakai continuous: gunakan past perfect (had known).</p>`,g8B),
SB('The Past Perfect Continuous is the past of the Present Perfect Continuous',`${TBL([['Present Perfect Continuous','have/has + been + V-ing','She <b>has been waiting</b> for an hour. (sampai sekarang)'],['Past Perfect Continuous','had + been + V-ing','She <b>had been waiting</b> for an hour when he came. (sampai waktu lampau)']],['Bentuk','Rumus','Contoh'])}<p>Ubah <b>have/has</b> menjadi <b>had</b>. Sisanya tetap: been + V-ing.</p>`,g8C)]},
{t:'The Future Tense',i:'🚀',les:true,bk:2,intro:'<b>Future Tense</b> menyatakan kegiatan yang akan terjadi, dengan <b>will</b> atau <b>be going to</b>.',sub:[
SB('Form',`${TBL([['Positif (will)','S + will + V1','She <b>will visit</b> Bali.'],['Negatif (will)','S + will not (won'+"'"+'t) + V1',"They <b>won't come</b> tomorrow."],['Tanya (will)','Will + S + V1 ?','<b>Will</b> he <b>help</b> us?'],['Be going to','S + am/is/are + going to + V1','I <b>am going to</b> study tonight. She <b>is going to</b> cook.']])}<ul><li><b>will</b> sama untuk semua subjek. Verb setelah will selalu bentuk dasar.</li><li>Kontraksi: I'll, she'll, won't.</li><li>Be going to: am untuk I, is untuk he/she/it, are untuk you/we/they.</li></ul>`,g9A),
SB('Usage',`<p><b>Will</b> untuk:</p><ol><li>Keputusan spontan: The phone is ringing. I <i>will answer</i> it.</li><li>Janji atau tawaran: I <i>will help</i> you.</li><li>Prediksi berdasarkan pendapat: I think it <i>will be</i> sunny.</li></ol><p><b>Be going to</b> untuk rencana atau prediksi berdasarkan bukti: Look at those clouds. It <i>is going to rain</i>.</p><p><b>Penanda waktu:</b> tomorrow, tonight, soon, next week, next year, in two days.</p>`,g9B),
SB('Future Tense: Short Answers to Questions',`<p>Jawaban singkat memakai kata bantu yang sama. <b>Verb utama tidak diulang.</b></p>${TBL([['Will you come?','Yes, I <b>will</b>.',"No, I <b>won't</b>."],['Will she help?','Yes, she <b>will</b>.',"No, she <b>won't</b>."],['Is he going to study?','Yes, he <b>is</b>.',"No, he <b>isn't</b>."],['Are you going to leave?','Yes, I <b>am</b>.',"No, I <b>'m not</b>."]],['Pertanyaan','Positif','Negatif'])}`,g9C),
SB('Be Going to and Will',`${TBL([['Be going to','Rencana yang sudah dibuat; bukti saat ini','We <b>are going to</b> visit Bali (tiket sudah dibeli). Look! It <b>is going to</b> rain.'],['Will','Keputusan spontan; janji; tawaran; pendapat','I <b>will</b> answer it. I think it <b>will</b> rain tomorrow.']],['Bentuk','Dipakai untuk','Contoh'])}<ul><li>Sudah direncanakan atau ada bukti → <b>be going to</b>.</li><li>Baru diputuskan, berjanji, menawarkan, atau berpendapat → <b>will</b>.</li></ul>`,g9D)]},
{t:'The Future Continuous Tense',i:'🔭',les:true,bk:2,intro:'<b>Future Continuous</b> menyatakan kegiatan yang sedang berlangsung pada waktu tertentu di masa depan.',sub:[
SB('Form',`${TBL([['Positif','S + will + be + V-ing','I <b>will be studying</b> at 8 p.m.'],['Negatif','S + will not (won'+"'"+'t) + be + V-ing',"They <b>won't be working</b> tomorrow."],['Tanya','Will + S + be + V-ing ?','<b>Will</b> she <b>be sleeping</b>?']])}<ul><li><b>will</b> sama untuk semua subjek.</li><li>Setelah <b>be</b>, verb memakai V-ing.</li><li>Kontraksi: I'll be, she'll be, won't be.</li></ul>`,g10A),
SB('Usage',`<ol><li><b>Kegiatan sedang berlangsung pada waktu tertentu di masa depan</b>: At 8 p.m. tonight, I <i>will be studying</i>.</li><li><b>Kegiatan berlangsung ketika kejadian lain terjadi</b>: When you arrive, I <i>will be cooking</i> dinner.</li><li><b>Pertanyaan sopan tentang rencana</b>: <i>Will</i> you <i>be using</i> the car this evening?</li></ol><p><b>Penanda waktu:</b> at 8 p.m. tonight, this time tomorrow, this time next week, at noon tomorrow, when you arrive.</p><p><b>Stative verb</b> (know, like, want) tidak dipakai continuous: gunakan will + V1.</p>`,g10B)]},
{t:'The Future Perfect Tense',i:'🏁',les:true,bk:2,intro:'<b>Future Perfect</b> menyatakan kegiatan yang sudah selesai sebelum waktu atau kejadian tertentu di masa depan.',sub:[
SB('Form',`${TBL([['Positif','S + will + have + V3','I <b>will have finished</b> my homework.'],['Negatif','S + will not (won'+"'"+'t) + have + V3',"They <b>won't have finished</b> the work."],['Tanya','Will + S + have + V3 ?','<b>Will</b> she <b>have left</b>?']])}<ul><li><b>will have</b> sama untuk semua subjek.</li><li>Setelah <b>have</b>, verb memakai V3 (past participle).</li><li>Kontraksi: I'll have, she'll have, won't have.</li></ul>`,g11A),
SB('Usage',`<ol><li><b>Selesai sebelum waktu tertentu di masa depan</b>: By 5 p.m., I <i>will have finished</i> my homework.</li><li><b>Selesai sebelum kejadian lain di masa depan</b>: By the time you arrive, she <i>will have left</i>.</li><li><b>Lama kegiatan yang tercapai pada waktu tertentu</b>: By June, I <i>will have lived</i> here for five years.</li></ol><p><b>Penanda waktu:</b> by + waktu (by 5 p.m., by tomorrow, by 2030), by the time + kalimat, before.</p><p>Kegiatan yang sedang berlangsung memakai <b>future continuous</b>. Kegiatan yang sudah selesai memakai <b>future perfect</b>.</p>`,g11B)]},
{t:'The Principal Parts of a Verb',i:'🧩',les:true,bk:2,intro:'<b>Principal parts</b> adalah bentuk dasar verb: V1 (dasar), V2 (simple past), V3 (past participle), dan V-ing (present participle).',sub:[
SB('Regular Verb',`<p>Verb beraturan: <b>V2 dan V3 sama</b>, dibentuk dengan menambah <b>-ed</b>.</p>${TBL([['walk','walked','walked','walking'],['like','liked','liked','liking'],['study','studied','studied','studying'],['play','played','played','playing'],['stop','stopped','stopped','stopping']],['V1','V2','V3','V-ing'])}<ul><li>Umumnya + <b>-ed</b>: walk → walked.</li><li>Berakhiran -e + <b>-d</b>: like → liked.</li><li>Konsonan + y → <b>-ied</b>: study → studied. Vokal + y → -ed: play → played.</li><li>Satu suku kata pola konsonan-vokal-konsonan: huruf akhir digandakan: stop → stopped.</li></ul>`,g12A),
SB('Irregular Verb',`<p>Verb tak beraturan: V2 dan V3 <b>tidak</b> dibentuk dengan -ed. Bentuknya harus dihafal. Ada tiga pola:</p>${TBL([['Pola 1','V1 = V2 = V3','cut - cut - cut'],['Pola 2','V2 = V3','buy - bought - bought'],['Pola 3','V1, V2, V3 berbeda','go - went - gone']],['Pola','Ciri','Contoh'])}<p>Kasus khusus: come - came - come, run - ran - run, become - became - become (V1 = V3).</p><p>Salah: <s>buyed</s>, <s>goed</s>, <s>eated</s>. Benar: bought, went, ate.</p>`,g12B),
SB('List of Irregular Verb',`<p><b>Pola 1: V1 = V2 = V3</b></p>${TBL(IRS.map(z=>[...z]),['V1','V2','V3','Arti'])}<p><b>Pola 2: V2 = V3</b></p>${TBL(IRT.map(z=>[...z]),['V1','V2','V3','Arti'])}<p><b>Pola 3: V1, V2, V3 berbeda</b></p>${TBL(IRA.map(z=>[...z]),['V1','V2','V3','Arti'])}<p><b>Pola khusus: V1 = V3</b></p>${TBL(IRX.map(z=>[...z]),['V1','V2','V3','Arti'])}`,g12C)]}
];

function chipsH(){const h=sg(LSH,[]);return h.length?`<div class="card"><b>Lanjutkan sebagai</b><div class="chips" style="margin-top:8px">${h.map((x,i)=>`<span class="chip"><span role="button" tabindex="0" onclick="loginH(${i})">${esc(x.n)} · ${esc(x.k)} · ${esc(x.s)}</span><s role="button" tabindex="0" aria-label="Hapus riwayat" onclick="delH(${i})">✕</s></span>`).join('')}</div></div>`:''}
const W={};
W.login=()=>`<div class="hero" style="margin-bottom:14px"><div><h1>GRAMMAR</h1><p style="margin:.3em 0">Latihan Grammar Bahasa Inggris · Poin XP</p></div></div>
${chipsH()}<div class="card"><label for="ln">Nama</label><input type="text" id="ln" maxlength="40" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
<label for="lk">Kelas</label><select id="lk" onchange="$('#lko').hidden=this.value!==KL[KL.length-1]">${KL.map(k=>`<option>${esc(k)}</option>`).join('')}</select>

W.fail=()=>`<div class="card" style="text-align:center"><h2>Gagal memuat progres</h2><p>Koneksi bermasalah. Data belum dimuat agar progres tersimpan tidak tertimpa data kosong.</p><button class="btn" onclick="retryLogin()">Coba lagi</button> <button class="btn s" onclick="V='login';render()">Kembali</button></div>`;
let LC=null;
async function doLogin(){
  const n=$('#ln').value.trim().replace(/\s+/g,' '),s=$('#ls').value.trim().replace(/\s+/g,' ');let k=$('#lk').value;if(k===KL[KL.length-1])k=$('#lko').value.trim();
  if(!n){toast('Isi nama dulu');return}if(!k){toast('Tulis kelas');return}if(!s){toast('Isi nama sekolah');return}
  LC={n,k,s};await startSession();
}
function loginH(i){const x=sg(LSH,[])[i];if(x){LC=x;startSession()}}
function delH(i){const h=sg(LSH,[]);h.splice(i,1);ss(LSH,h);render()}
const retryLogin=()=>startSession();
async function startSession(){
  const{n,k,s}=LC,key=ukey(s,k,n);let loc=sg(LS+'_'+key,null);let rem=null;
  if(DB){try{const sn=await Promise.race([DB.ref(`${APP}/detail/${key}`).once('value'),new Promise((_,r)=>setTimeout(()=>r(new Error('to')),9000))]);rem=sn.val()}catch(e){V='fail';render();return}}
  let d=loc,r=rem;if(r&&(!d||(r.t||0)>(d.t||0)))d=r;
  S=norm(d?Object.assign({},d,{n,k,s,key}):newS(n,k,s));S.key=key;
  const h=sg(LSH,[]).filter(x=>!(x.n===n&&x.k===k&&x.s===s));h.unshift({n,k,s});ss(LSH,h.slice(0,6));
  persist();presOn();P=null;V='buku';render();scrollTo(0,0);
}
function logout(){flush();presOff();S=null;P=null;GA=false;V='login';render()}

/* ========= SOAL LATIHAN ========= */
function recordAns(q,ok){
  const k=`${q.b}_${q.s}_${q.l}`,a=S.ac[k]||(S.ac[k]={n:0,ok:0});a.n++;if(ok)a.ok++;
  if(!ok){const i=S.wr.findIndex(w=>w.q===q.q&&w.a===q.a);if(i>=0){S.wr[i].c++;S.wr[i].t=Date.now()}else S.wr.push({q:q.q,a:q.a,e:q.e,c:1,t:Date.now(),im:q.img?1:0});
    if(S.wr.length>80){S.wr.sort((x,y)=>y.t-x.t);S.wr=S.wr.slice(0,60)}}
}
function ans(i){
  if(P.ans[P.i]!=null)return;const q=P.qs[P.i],ok=q.o[i]===q.a;P.ans[P.i]=i;
  S.tot++;if(ok){S.ok++;S.xp+=10}recordAns(q,ok);touch();sv();render();
}
function nextQ(){if(P.i<P.qs.length-1){P.i++;sv();render();scrollTo(0,0)}else finishLat()}
const starsOf=sc=>sc>=90?3:sc>=70?2:sc>=40?1:0;
function finishLat(){
  const n=P.qs.length,ok=P.qs.filter((q,i)=>q.o[P.ans[i]]===q.a).length,sc=Math.round(ok/n*100),st=starsOf(sc);
  let bonus=20;if(sc===100){bonus+=50;S.perf=true}S.xp+=bonus;
  const bk=P.s<0?P.b+'_mix':`${P.b}_${P.s}_${P.l}`;
  const o=S.st[bk];if(!o||sc>o.b)S.st[bk]={b:sc,s:Math.max(st,o?o.s:0)};else if(st>o.s)o.s=st;
  S.pv[bk]=P.qs.map(qk);P.fin={ok,n,sc,st,bonus};S.ses=null;sv();V='res';render();scrollTo(0,0);if(sc>=70)confetti();
}

${done?`<div class="fb ${q.o[a]===q.a?'ok':'bad'}"><b>${q.o[a]===q.a?'✅ Benar! +10 XP':'❌ Belum tepat.'}</b><div>Jawaban benar: <b>${esc(q.a)}</b></div><div style="color:var(--mut)">${esc(q.e)}</div></div><button class="btn" onclick="nextQ()">${last?'Lihat hasil':'Soal berikutnya ›'}</button>`:''}

function xstart(){

}

  return `<div class="card"><h3>${CI[b]} Lesson ${lno(b)}. ${esc(c.t)}</h3><small>${c.les?(S.st[b+'_mix']?'Kuis terbaik '+S.st[b+'_mix'].b+' '+'★'.repeat(S.st[b+'_mix'].s)+' · ':'Kuis belum selesai · ')+tried+'/'+c.sub.length+' sub-bab dicoba':tried+'/'+c.sub.length+' sub-bab dicoba'} · akurasi ${n?Math.round(ok/n*100):0}%</small><div class="tbl-w"><table class="tbl"><tr><th>Sub-bab</th><th>Skor</th></tr>${c.sub.map((sb,s)=>`<tr><td>${esc(sb.n)}</td>${[0].map(l=>{if(c.les){const a=S.ac[`${b}_${s}_${l}`];return `<td>${a?Math.round(a.ok/a.n*100)+'% <small>('+a.n+' soal)</small>':'–'}</td>`}const t=S.st[`${b}_${s}_${l}`];return `<td>${t?t.b+' '+'★'.repeat(t.s):'–'}</td>`}).join('')}</tr>`).join('')}</table></div></div>`}).join('')}
<div class="card"><h3>Riwayat ulangan mandiri</h3>${S.xh.length?`<div class="tbl-w"><table class="tbl"><tr><th>Waktu</th><th>Materi</th><th>Skor</th></tr>${S.xh.map(h=>`<tr><td>${new Date(h.t).toLocaleString('id-ID')}</td><td>${esc(h.m)}</td><td><b>${h.sc}</b></td></tr>`).join('')}</table></div>`:'Belum ada.'}</div>
<div class="card"><h3>Soal yang pernah salah</h3>${S.wr.length?[...S.wr].sort((a,b)=>b.c-a.c||b.t-a.t).slice(0,10).map(w=>`<div style="padding:8px 0;border-top:1px solid var(--line)">${qh(w.q)}${w.im?' 🖼️':''}<div>Benar: <b class="grn">${esc(w.a)}</b> · salah ${w.c}×</div><small style="color:var(--mut)">${esc(w.e)}</small></div>`).join(''):'Belum ada soal salah. 🎉'}</div>`;

/* ========= GURU ========= */
W.guru=()=>{
  if(!GA)return `<div class="card" style="max-width:420px;margin:auto"><h2>Dashboard Guru</h2><label for="ge">Email</label><input type="email" id="ge"><label for="gp">PIN</label><input type="password" id="gp" onkeydown="if(event.key==='Enter')gLogin()"><button class="btn" onclick="gLogin()">Masuk</button></div>`;
  const sks=[...new Set(GL.map(x=>x.s))],kls=[...new Set(GL.map(x=>x.k))];
  return `<h2>Dashboard Guru</h2><div class="card"><div class="row"><select id="fs" style="width:auto" onchange="GF.sk=this.value;gt()"><option value="">Semua sekolah</option>${sks.map(x=>`<option ${GF.sk===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="fk" style="width:auto" onchange="GF.kl=this.value;gt()"><option value="">Semua kelas</option>${kls.map(x=>`<option ${GF.kl===x?'selected':''}>${esc(x)}</option>`).join('')}</select><input type="text" placeholder="Cari nama" style="width:200px" value="${esc(GF.q)}" oninput="GF.q=this.value;gt()"><span id="gon" class="pill"></span><span class="sync">${DB?'Realtime':'Data perangkat ini (offline)'}</span></div><div class="tbl-w" id="gtb">${gtbl()}</div></div>`;
};
function gRows(){return GL.filter(x=>(!GF.sk||x.s===GF.sk)&&(!GF.kl||x.k===GF.kl)&&(!GF.q||x.n.toLowerCase().includes(GF.q.toLowerCase())))}
const isOn=p=>p&&p.on&&(Date.now()+OFS-p.t)<75000;
function gtbl(){const r=gRows();const on=r.filter(x=>isOn(x.p)).length;setTimeout(()=>{const e=$('#gon');if(e)e.textContent=`${on} online`},0);
  return `<table class="tbl"><tr><th>Status</th><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>XP</th><th>Soal</th><th>Akurasi</th><th>Terakhir aktif</th></tr>${r.map(x=>`<tr style="cursor:pointer" onclick="gopen('${esc(x.key)}')"><td>${isOn(x.p)?'<span class="on">● online</span>':'○'}</td><td>${esc(x.n)}</td><td>${esc(x.k)}</td><td>${esc(x.s)}</td><td>${x.xp}</td><td>${x.tot}</td><td>${x.tot?Math.round(x.ok/x.tot*100):0}%</td><td>${x.t?new Date(x.t).toLocaleString('id-ID'):'–'}</td></tr>`).join('')||'<tr><td colspan="8">Belum ada siswa.</td></tr>'}</table>`}
function gt(){const e=$('#gtb');if(e)e.innerHTML=gtbl()}
function gLogin(){const e=$('#ge').value.trim(),p=$('#gp').value;if(e.toLowerCase()===TEMAIL.toLowerCase()&&p===TPIN){GA=true;render()}else toast('Email atau PIN salah')}
async function guruLoad(){
  try{let m,pr={};if(DB){m=(await DB.ref(`${APP}/ringkas`).once('value')).val()||{};pr=(await DB.ref(`${APP}/presence`).once('value')).val()||{}}else m=sg(LSS,{});
    GL=Object.entries(m).map(([key,x])=>Object.assign({key},x,{p:pr[key]})).sort((a,b)=>b.xp-a.xp);if(V==='guru'){gt()}}catch(e){}
  if(V==='guru'&&!$('#gtb')&&GA)render();
}
async function gopen(key){
  let d=null;try{d=DB?(await DB.ref(`${APP}/detail/${key}`).once('value')).val():sg(LS+'_'+key,null)}catch(e){}
  if(!d){toast('Data tidak ditemukan');return}GD=norm(d);GD.key=key;GC=null;V='gdet';render();scrollTo(0,0);
}
W.gdet=()=>{
  const d=GD,rows=[];
  T.forEach((c,b)=>c.sub.forEach((sb,s)=>[0].forEach(l=>{const a=d.ac[`${b}_${s}_${l}`];if(a)rows.push({b,s,l,n:a.n,p:Math.round(a.ok/a.n*100)})})));
  const weak=rows.filter(r=>r.n>=5).sort((a,b)=>a.p-b.p).slice(0,5);
  return `<button class="btn s" onclick="go('guru')">‹ Daftar siswa</button><h2>${esc(d.n)} <small>(${esc(d.k)} · ${esc(d.s)})</small></h2>
<div class="stats"><div class="stat"><b>${d.xp}</b>XP</div><div class="stat"><b>${d.streak}</b>Streak</div><div class="stat"><b>${d.tot}</b>Soal</div><div class="stat"><b>${accOf(d)}%</b>Akurasi</div></div>
<div class="card"><h3>Akurasi per bab</h3>${T.map((c,b)=>{let n=0,o=0;c.sub.forEach((_,s)=>[0].forEach(l=>{const a=d.ac[`${b}_${s}_${l}`];if(a){n+=a.n;o+=a.ok}}));const p=n?Math.round(o/n*100):0;return `<div style="margin:6px 0">${lbl(b)}. ${esc(c.t)} — <b>${p}%</b> (${n} soal)<div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
<div class="card"><h3>⚠️ Perlu bimbingan</h3>${weak.length?weak.map(r=>`<div>${esc(sbn(r.b,r.s))} — <b class="red">${r.p}%</b> (${r.n} soal)</div>`).join(''):'Belum ada materi dengan ≥5 soal per level.'}</div>
<div class="card tbl-w"><h3>Akurasi per sub-bab</h3><table class="tbl"><tr><th>Sub-bab</th><th>Skor</th></tr>${T.flatMap((c,b)=>c.sub.map((sb,s)=>`<tr><td>${lbl(b)}. ${esc(sb.n)}</td>${[0].map(l=>{const a=d.ac[`${b}_${s}_${l}`];if(!a)return '<td>–</td>';const p=Math.round(a.ok/a.n*100);return `<td class="${p<60?'red':'grn'}">${p}% <small>(${a.n})</small></td>`}).join('')}</tr>`)).join('')}</table></div>
<div class="card"><h3>Riwayat ulangan</h3>${d.xh.length?d.xh.map(h=>`<div>${new Date(h.t).toLocaleString('id-ID')} · ${esc(h.m)} · <b>${h.sc}</b></div>`).join(''):'Belum ada.'}</div>
<div class="card"><h3>Soal yang sering salah</h3>${d.wr.length?[...d.wr].sort((a,b)=>b.c-a.c).slice(0,10).map(w=>`<div style="padding:6px 0;border-top:1px solid var(--line)">${qh(w.q)}<br>Benar: <b>${esc(w.a)}</b> · ${w.c}×</div>`).join(''):'Tidak ada.'}</div>
<div class="card"><h3>Kelola data</h3>${DB?(AU&&AU.currentUser?`<button class="btn d" onclick="gdel('${esc(d.key)}')">${GC===d.key?'Yakin hapus? Klik lagi':'Hapus data siswa'}</button>`:`<label>Login admin</label><input type="email" id="ae" placeholder="Email admin"><input type="password" id="ap" placeholder="Password"><div class="row"><button class="btn" onclick="adminIn()">Masuk</button><button class="btn s" onclick="adminG()">Masuk dengan Google</button></div>`):`<button class="btn d" onclick="gdel('${esc(d.key)}')">${GC===d.key?'Yakin hapus? Klik lagi':'Hapus data lokal siswa'}</button>`}</div>`;
};
async function adminIn(){try{await AU.signInWithEmailAndPassword($('#ae').value,$('#ap').value);render()}catch(e){toast('Login admin gagal')}}
async function adminG(){try{await AU.signInWithPopup(new firebase.auth.GoogleAuthProvider());render()}catch(e){toast('Login Google gagal')}}
async function gdel(key){
  if(GC!==key){GC=key;render();return}
  try{if(DB){await Promise.all(['detail','ringkas','presence'].map(p=>DB.ref(`${APP}/${p}/${key}`).remove()))}
    try{localStorage.removeItem(LS+'_'+key)}catch(e){}const m=sg(LSS,{});delete m[key];ss(LSS,m);GC=null;toast('Data dihapus');GL=GL.filter(x=>x.key!==key);go('guru')}catch(e){toast('Gagal hapus (perlu admin)')}
}

/* ========= VALIDATOR ========= */
let VR=null;
W.val=()=>`<h2>🧪 Validator Soal</h2><div class="card"><p>Membuat seluruh soal (semua bab, sub-bab, level) lalu memeriksa: 20 soal unik per sub-bab, jawaban ada di opsi, opsi tidak ganda, minimal 4 opsi.</p><button class="btn" onclick="runVal()">Jalankan validator</button></div>${VR?`<div class="card"><h3>Total soal: ${VR.total} · Temuan: ${VR.issues.length}</h3>${VR.issues.length?VR.issues.slice(0,40).map(x=>`<div class="red">• ${esc(x)}</div>`).join(''):'<div class="grn">✓ Semua soal lolos pemeriksaan.</div>'}</div>`:''}`;
function runVal(){
  const issues=[];let total=0;
  T.forEach((c,b)=>c.sub.forEach((sb,s)=>[0].forEach(l=>{
    const qs=genSet(b,s,l,20),tag=`${lbl(b)}.${s+1}`;total+=qs.length;
    if(qs.length<20)issues.push(`${tag}: hanya ${qs.length} soal unik`);
    qs.forEach((q,i)=>{if(!q.o.includes(q.a))issues.push(`${tag} #${i+1}: jawaban tidak ada di opsi`);if(new Set(q.o).size!==q.o.length)issues.push(`${tag} #${i+1}: opsi ganda`);if(q.o.length<4||q.bad)issues.push(`${tag} #${i+1}: pengecoh kurang — ${q.q}`)});
  })));
  T.forEach((c,b)=>{if(!c.les)return;const qs=genMix(b,20),tag=`${lbl(b)} kuis`;total+=qs.length;
    if(qs.length<20)issues.push(`${tag}: hanya ${qs.length} soal`);
    const cnt={};qs.forEach(q=>cnt[q.s]=(cnt[q.s]||0)+1);c.sub.forEach((_,s)=>{if(!cnt[s])issues.push(`${tag}: sub-bab ${s+1} tidak terwakili`)});
    qs.forEach((q,i)=>{if(!q.o.includes(q.a)||new Set(q.o).size!==q.o.length||q.o.length<4||q.bad)issues.push(`${tag} #${i+1}: ${q.q}`)})});
  VR={total,issues};render();
}

/* ========= TEMA, PARTIKEL, CONFETTI ========= */
const TH=[['samudra','Samudra','🫧'],['synthwave','Synthwave','✦'],['sakura','Sakura','🌸'],['kode','Kode Hijau','is/are'],['light','Terang','☀️'],['dark','Gelap','🌙']];
function setTheme(t,save){document.documentElement.dataset.theme=t;if(save)try{localStorage.setItem(LST,t)}catch(e){}particles(t);
  $('#thp').innerHTML=TH.map(x=>`<button class="${x[0]===t?'on':''}" onclick="setTheme('${x[0]}',true)">${x[1]}</button>`).join('')}
function particles(t){const ch=(TH.find(x=>x[0]===t)||TH[0])[2],list=t=='kode'?['is','are','-s','-ed','-ing','a','an']:[ch];
  $('#bg').innerHTML=rm()?'':Array.from({length:14},(_,i)=>`<span style="left:${ri(0,96)}%;animation-duration:${ri(14,30)}s;animation-delay:-${ri(0,25)}s">${list[i%list.length]}</span>`).join('')}
$('#thb').onclick=()=>{const p=$('#thp');p.hidden=!p.hidden};
function confetti(){
  if(rm())return;const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:Math.random()*4-2,vy:Math.random()*3+3,c:`hsl(${ri(0,360)} 90% 60%)`,s:ri(5,10)}));let f=0;
  (function a(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
}

(async function init(){
  const th=tsg(LST),t=th&&TH.some(x=>x[0]===th)?th:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'samudra');

})();
